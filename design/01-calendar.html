        </div>
      </div>
      <div class="card-record-time" id="cardRecordTime">⏰ 今早 09:00 记录</div>
      <div class="card-message">
        轻了一点点，昨天的自律没有白费。别得意，奶茶在前方等着你。
      </div>
    </div>
    <div id="cardEmpty" style="display: none;">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"></path>
          <path d="M12 6v6l4 2"></path>
        </svg>
      </div>
      <div class="empty-reminder">⏰ 还没记录今天的体重哦</div>
      <div class="empty-title">今日待称重</div>
      <div class="empty-desc">早起空腹称一称<br>坚持记录，才能看见变化</div>
      <div class="empty-btn">＋ 立即记录</div>
    </div>
  </div>

  <div class="page-indicator">
    <div class="page-dot active"></div>
    <div class="page-dot"></div>
    <div class="page-dot"></div>
  </div>
</div>

<!-- FAB -->
<div class="fab" id="fab" title="记录体重">
  <svg viewBox="0 0 24 24">
    <line x1="12" y1="5" x2="12" y2="19"></line>
    <line x1="5" y1="12" x2="19" y2="12"></line>
  </svg>
</div>

<!-- Weight input modal -->
<div class="modal-overlay" id="modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">记录体重</div>
    <div class="modal-subtitle" id="modalDate">8月24日 · 今天</div>
    <div class="weight-input-wrap">
      <div class="weight-btn" id="weightMinus">−</div>
      <div class="weight-display"><span id="weightValue">62.4</span><span class="unit">kg</span></div>
      <div class="weight-btn" id="weightPlus">+</div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelBtn">取消</button>
      <button class="btn btn-primary" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<!-- Year-Month picker modal -->
<div class="modal-overlay" id="pickerModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">选择年月</div>
    <div class="modal-subtitle">滑动选择后点击确定跳转</div>

    <div class="picker-wrap">
      <div style="flex: 1;">
        <div class="picker-label">年 份</div>
        <div class="picker-col" id="yearPicker">
          <div class="picker-center-line"></div>
          <!-- Year items generated by JS -->
        </div>
      </div>
      <div style="flex: 1;">
        <div class="picker-label">月 份</div>
        <div class="picker-col" id="monthPicker">
          <div class="picker-center-line"></div>
          <!-- Month items generated by JS -->
        </div>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closePicker()">取消</button>
      <button class="btn btn-primary" onclick="confirmPicker()">确定</button>
    </div>
  </div>
</div>

<!-- Design nav -->
<div class="design-nav">
  <a href="01-calendar.html" class="active">日历</a>
  <a href="02-todo.html">待办</a>
  <a href="04-detail.html">日笺</a>
  <a href="03-settings.html">设置</a>
</div>

<script>
  // Mock weight data
  const weightData = {
    '2026-8-1': 63.5,
    '2026-8-2': 63.2,
    '2026-8-3': 63.3,
    '2026-8-4': 63.0,
    '2026-8-5': 62.8,
    '2026-8-6': 63.1,
    '2026-8-7': 62.9,
    '2026-8-8': 62.7,
    '2026-8-9': 62.6,
    '2026-8-10': 62.8,
    '2026-8-11': 62.5,
    '2026-8-12': 62.3,
    '2026-8-13': 62.4,
    '2026-8-14': 62.2,
    '2026-8-15': 62.0,
    '2026-8-16': 62.3,
    '2026-8-17': 62.1,
    '2026-8-18': 61.9,
    '2026-8-19': 62.2,
    '2026-8-20': 62.0,
    '2026-8-21': 62.5,
    '2026-8-22': 62.7,
    '2026-8-23': 62.7,
    '2026-8-24': 62.4,
  };

  let currentYear = 2026;
  let currentMonth = 8; // 1-12
  let selectedDate = 24;
  let currentWeight = 62.4;

  const messages = {
    down: [
      '轻了一点点，昨天的自律没有白费。别得意，奶茶在前方等着你。',
      '体重下降了，是时候奖励自己一顿…蔬菜沙拉了。',
      '不错不错，继续保持。不过你昨天那口蛋糕我可记着呢。',
      '数字变小了，裤子变松了，人生也轻盈了。'
    ],
    up: [
      '重了一点点，昨晚的夜宵好吃吗？',
      '体重上涨，说明你最近过得不错。好是好，就是裤子紧了。',
      '没事，明天少吃一口就回来了。就一口，真的。',
      '涨了涨了，钱包没涨体重先涨了。'
    ],
    same: [
      '纹丝不动，稳如泰山。也好，至少没涨。',
      '体重没变化，你的身体在思考人生。',
      '不增不减，不垢不净。佛系体重，佛系人生。'
    ]
  };

  function renderCalendar() {
    const grid = document.getElementById('daysGrid');
    grid.innerHTML = '';

    const firstDay = new Date(currentYear, currentMonth - 1, 1);
    const lastDay = new Date(currentYear, currentMonth, 0);
    const startWeekday = firstDay.getDay();
    const daysInMonth = lastDay.getDate();

    // Previous month days
    const prevMonthLastDay = new Date(currentYear, currentMonth - 1, 0).getDate();
    for (let i = startWeekday - 1; i >= 0; i--) {
      const day = prevMonthLastDay - i;
      grid.appendChild(createDayCell(day, true, currentMonth === 1 ? 12 : currentMonth - 1));
    }

    // Current month days
    const today = new Date();
    const isCurrentMonth = today.getFullYear() === currentYear && (today.getMonth() + 1) === currentMonth;

    for (let day = 1; day <= daysInMonth; day++) {
      const cell = createDayCell(day, false, currentMonth);
      if (isCurrentMonth && day === today.getDate()) {
        cell.classList.add('today');
      }
      grid.appendChild(cell);
    }

    // Next month days
    const totalCells = startWeekday + daysInMonth;
    const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
    for (let day = 1; day <= remaining; day++) {
      grid.appendChild(createDayCell(day, true, currentMonth === 12 ? 1 : currentMonth + 1));
    }

    document.getElementById('monthTitle').textContent = `${currentYear} · ${currentMonth}月`;
  }

  function createDayCell(day, isOtherMonth, month) {
    const cell = document.createElement('div');
    cell.className = 'day-cell' + (isOtherMonth ? ' other-month' : '');

    const key = `${currentYear}-${month}-${day}`;
    const weight = weightData[key];

    const numEl = document.createElement('div');
    numEl.className = 'day-num';
    numEl.textContent = day;
    cell.appendChild(numEl);

    if (weight !== undefined) {
      cell.classList.add('has-weight');
      const wEl = document.createElement('div');
      wEl.className = 'day-weight';
      wEl.textContent = weight.toFixed(1);
      cell.appendChild(wEl);

      // Change from previous day
      const prevDate = new Date(currentYear, month - 1, day - 1);
      const prevKey = `${prevDate.getFullYear()}-${prevDate.getMonth() + 1}-${prevDate.getDate()}`;
      const prevWeight = weightData[prevKey];

      if (prevWeight !== undefined) {
        const diff = (weight - prevWeight).toFixed(1);
        if (diff !== '0.0') {
          const changeEl = document.createElement('div');
          changeEl.className = 'day-change ' + (diff > 0 ? 'up' : 'down');
          changeEl.innerHTML = `
            <svg viewBox="0 0 24 24" fill="currentColor">
              ${diff > 0 ? '<path d="M7 14l5-5 5 5z"/>' : '<path d="M7 10l5 5 5-5z" transform="rotate(180 12 12)"/>'}
            </svg>
            ${Math.abs(diff)}
          `;
          cell.appendChild(changeEl);
        }
      }
    }

    cell.addEventListener('click', () => {
      if (isOtherMonth) return;
      selectedDate = day;
      currentWeight = weight || 62.0;

      const today = new Date();
      const isToday = today.getFullYear() === currentYear &&
                      (today.getMonth() + 1) === currentMonth &&
                      day === today.getDate();
      const isPast = new Date(currentYear, currentMonth - 1, day) <
                     new Date(today.getFullYear(), today.getMonth(), today.getDate());

      if (isPast && weight !== undefined) {
        // 过去的日期且有记录 → 去详情页
        location.href = `04-detail.html?date=${currentYear}-${currentMonth}-${day}`;
      } else if (isPast && weight === undefined) {
        // 过去的日期无记录 → 仍可补录
        openModal(day);
      } else {
        // 今天或未来 → 录入体重
        openModal(day);
      }
    });

    return cell;
  }

  function openModal(day) {
    const modal = document.getElementById('modal');
    const today = new Date();
    const isToday = today.getFullYear() === currentYear &&
                    (today.getMonth() + 1) === currentMonth &&
                    day === today.getDate();
    document.getElementById('modalDate').textContent =
      `${currentMonth}月${day}日${isToday ? ' · 今天' : ''}`;

    // 当天无记录时，初始值取前一天体重
    const key = `${currentYear}-${currentMonth}-${day}`;
    if (weightData[key] === undefined) {
      const prevDate = new Date(currentYear, currentMonth - 1, day - 1);
      const prevKey = `${prevDate.getFullYear()}-${prevDate.getMonth() + 1}-${prevDate.getDate()}`;
      if (weightData[prevKey] !== undefined) {
        currentWeight = weightData[prevKey];
      }
    }

    document.getElementById('weightValue').textContent = currentWeight.toFixed(1);
    modal.classList.add('active');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('active');
  }

  // Modal interactions
  document.getElementById('fab').addEventListener('click', () => openModal(selectedDate));
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('modal').addEventListener('click', (e) => {
    if (e.target.id === 'modal') closeModal();
  });

  document.getElementById('weightMinus').addEventListener('click', () => {
    currentWeight = Math.max(30, currentWeight - 0.1);
    document.getElementById('weightValue').textContent = currentWeight.toFixed(1);
  });
  document.getElementById('weightPlus').addEventListener('click', () => {
    currentWeight = Math.min(200, currentWeight + 0.1);
    document.getElementById('weightValue').textContent = currentWeight.toFixed(1);
  });

  document.getElementById('saveBtn').addEventListener('click', () => {
    const key = `${currentYear}-${currentMonth}-${selectedDate}`;
    weightData[key] = currentWeight;
    renderCalendar();
    updateBottomCard();
    closeModal();
  });

  function updateBottomCard() {
    const key = `${currentYear}-${currentMonth}-${selectedDate}`;
    const weight = weightData[key];
    const card = document.getElementById('bottomCard');
    const contentEl = document.getElementById('cardContent');
    const emptyEl = document.getElementById('cardEmpty');

    const today = new Date();
    const isToday = today.getFullYear() === currentYear &&
                    (today.getMonth() + 1) === currentMonth &&
                    selectedDate === today.getDate();

    if (weight === undefined && isToday) {
      // 今天还没记录 → 空状态引导
      card.classList.add('empty');
      contentEl.style.display = 'none';
      emptyEl.style.display = 'block';
      return;
    }

    // 有体重数据 → 正常显示
    card.classList.remove('empty');
    contentEl.style.display = 'block';
    emptyEl.style.display = 'none';

    const displayWeight = weight || 62.4;
    const cardWeight = document.querySelector('.card-weight');
    cardWeight.innerHTML = `${displayWeight.toFixed(1)}<span class="unit">kg</span>`;

    const prevDate = new Date(currentYear, currentMonth - 1, selectedDate - 1);
    const prevKey = `${prevDate.getFullYear()}-${prevDate.getMonth() + 1}-${prevDate.getDate()}`;
    const prevWeight = weightData[prevKey];

    const changeEl = document.querySelector('.card-change');
    const msgEl = document.querySelector('.card-message');
    const timeEl = document.getElementById('cardRecordTime');

    if (prevWeight !== undefined && weight !== undefined) {
      const diff = (weight - prevWeight).toFixed(1);
      const absDiff = Math.abs(diff);

      if (diff > 0) {
        changeEl.className = 'card-change up';
        changeEl.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 14l5-5 5 5z"/></svg> ${absDiff}`;
        msgEl.textContent = messages.up[Math.floor(Math.random() * messages.up.length)];
      } else if (diff < 0) {
        changeEl.className = 'card-change down';
        changeEl.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 14l5-5 5 5z"/></svg> ${absDiff}`;
        msgEl.textContent = messages.down[Math.floor(Math.random() * messages.down.length)];
      } else {
        changeEl.className = 'card-change';
        changeEl.style.background = 'var(--paper)';
        changeEl.style.color = 'var(--ink-mute)';
        changeEl.innerHTML = `— 0.0`;
        msgEl.textContent = messages.same[Math.floor(Math.random() * messages.same.length)];
      }
    }

    // 记录时间
    if (weight !== undefined) {
      timeEl.style.display = 'block';
      if (isToday) {
        timeEl.textContent = '⏰ 今早 09:00 记录';
      } else {
        timeEl.textContent = `⏰ ${currentMonth}月${selectedDate}日 08:30 记录`;
      }
    } else {
      timeEl.style.display = 'none';
    }

    const weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
    const date = new Date(currentYear, currentMonth - 1, selectedDate);
    const weekday = weekdays[date.getDay()];
    document.getElementById('cardDate').textContent =
      `${currentMonth}月${selectedDate}日 · ${weekday}${isToday ? ' · 今天' : ''}`;
  }

  function onBottomCardClick() {
    const key = `${currentYear}-${currentMonth}-${selectedDate}`;
    const weight = weightData[key];

    const today = new Date();
    const isToday = today.getFullYear() === currentYear &&
                    (today.getMonth() + 1) === currentMonth &&
                    selectedDate === today.getDate();
    const isPast = new Date(currentYear, currentMonth - 1, selectedDate) <
                   new Date(today.getFullYear(), today.getMonth(), today.getDate());

    if (weight === undefined) {
      // 没有记录 → 打开录入
      openModal(selectedDate);
    } else if (isPast) {
      // 过去的日期有记录 → 去详情页
      location.href = `04-detail.html?date=${currentYear}-${currentMonth}-${selectedDate}`;
    } else {
      // 今天有记录 → 去待办页
      location.href = '02-todo.html';
    }
  }

  // Month navigation
  document.getElementById('prevMonth').addEventListener('click', () => {
    currentMonth--;
    if (currentMonth < 1) { currentMonth = 12; currentYear--; }
    const grid = document.getElementById('daysGrid');
    grid.classList.add('slide-right');
    setTimeout(() => {
      renderCalendar();
      grid.classList.remove('slide-right');
    }, 150);
  });

  document.getElementById('nextMonth').addEventListener('click', () => {
    currentMonth++;
    if (currentMonth > 12) { currentMonth = 1; currentYear++; }
    const grid = document.getElementById('daysGrid');
    grid.classList.add('slide-left');
    setTimeout(() => {
      renderCalendar();
      grid.classList.remove('slide-left');
    }, 150);
  });

  // Swipe support
  let touchStartX = 0;
  let touchEndX = 0;
  const calendar = document.querySelector('.calendar-wrap');

  calendar.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].screenX;
  });
  calendar.addEventListener('touchend', e => {
    touchEndX = e.changedTouches[0].screenX;
    handleSwipe();
  });

  function handleSwipe() {
    const diff = touchEndX - touchStartX;
    if (Math.abs(diff) < 50) return;
    if (diff > 0) {
      document.getElementById('prevMonth').click();
    } else {
      document.getElementById('nextMonth').click();
    }
  }

  // ===== Year-Month Picker =====
  let pickerYear = currentYear;
  let pickerMonth = currentMonth;

  function initPicker() {
    const yearPicker = document.getElementById('yearPicker');
    const monthPicker = document.getElementById('monthPicker');

    // Generate years (2020-2035)
    yearPicker.innerHTML = '<div style="height: 70px;"></div>';
    for (let y = 2020; y <= 2035; y++) {
      const item = document.createElement('div');
      item.className = 'picker-item';
      item.dataset.value = y;
      item.textContent = y + ' 年';
      item.addEventListener('click', () => scrollToPicker('yearPicker', y - 2020));
      yearPicker.appendChild(item);
    }
    yearPicker.innerHTML += '<div style="height: 70px;"></div>';

    // Generate months
    monthPicker.innerHTML = '<div style="height: 70px;"></div>';
    for (let m = 1; m <= 12; m++) {
      const item = document.createElement('div');
      item.className = 'picker-item';
      item.dataset.value = m;
      item.textContent = m + ' 月';
      item.addEventListener('click', () => scrollToPicker('monthPicker', m - 1));
      monthPicker.appendChild(item);
    }
    monthPicker.innerHTML += '<div style="height: 70px;"></div>';

    // Scroll events
    yearPicker.addEventListener('scroll', () => updatePickerSelection('yearPicker', 'year'));
    monthPicker.addEventListener('scroll', () => updatePickerSelection('monthPicker', 'month'));
  }

  function scrollToPicker(colId, index) {
    const col = document.getElementById(colId);
    col.scrollTo({ top: index * 60, behavior: 'smooth' });
  }

  function updatePickerSelection(colId, type) {
    const col = document.getElementById(colId);
    const scrollTop = col.scrollTop;
    const index = Math.round(scrollTop / 60);
    const items = col.querySelectorAll('.picker-item');

    items.forEach((item, i) => {
      item.classList.toggle('selected', i === index);
    });

    if (type === 'year') {
      pickerYear = 2020 + index;
    } else {
      pickerMonth = index + 1;
    }
  }

  function openPicker() {
    pickerYear = currentYear;
    pickerMonth = currentMonth;
    const modal = document.getElementById('pickerModal');
    modal.classList.add('active');

    // Need to wait for modal to be visible before scrolling
    setTimeout(() => {
      scrollToPicker('yearPicker', pickerYear - 2020);
      scrollToPicker('monthPicker', pickerMonth - 1);
    }, 50);
  }

  function closePicker() {
    document.getElementById('pickerModal').classList.remove('active');
  }

  function confirmPicker() {
    currentYear = pickerYear;
    currentMonth = pickerMonth;
    renderCalendar();
    updateBottomCard();
    closePicker();
  }

  // Click month title to open picker
  document.getElementById('monthTitle').addEventListener('click', openPicker);
  document.getElementById('pickerModal').addEventListener('click', (e) => {
    if (e.target.id === 'pickerModal') closePicker();
  });

  // Initialize picker
  initPicker();

  // Initial render
  renderCalendar();
</script>

</body>
</html>
