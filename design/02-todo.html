  <a href="02-todo.html" class="active">待办</a>
  <a href="04-detail.html">日笺</a>
  <a href="03-settings.html">设置</a>
</div>

<script>
  // State
  let pendingTasks = [
    { id: 1, text: '晨跑 30 分钟', order: 0 },
    { id: 2, text: '读 20 页书', order: 1 },
    { id: 3, text: '写日记', order: 2 },
    { id: 4, text: '冥想 10 分钟', order: 3 },
  ];

  let completedTasks = [
    { id: 5, text: '喝一杯温水', completedAt: '08:15' },
    { id: 6, text: '记录今日体重', completedAt: '09:00' },
  ];

  const commonTasks = [
    { id: 'c1', text: '晨跑 30 分钟' },
    { id: 'c2', text: '喝一杯温水' },
    { id: 'c3', text: '读 20 页书' },
    { id: 'c4', text: '写日记' },
    { id: 'c5', text: '冥想 10 分钟' },
    { id: 'c6', text: '健身 1 小时' },
    { id: 'c7', text: '学英语 30 分钟' },
    { id: 'c8', text: '早睡（11点前）' },
    { id: 'c9', text: '不吃宵夜' },
    { id: 'c10', text: '吃水果' },
    { id: 'c11', text: '站墙 15 分钟' },
    { id: 'c12', text: '涂防晒霜' },
  ];

  let selectedCommon = []; // ordered list of selected task ids
  let nextId = 7;

  const messages = {
    low: [
      '刚完成一件，热热身呢。',
      '万事开头难，你已经开了头。',
      '千里之行，始于足下。足下已经动了。'
    ],
    mid: [
      '已完成一半，不错的节奏。',
      '进度过半，剩下的一鼓作气？',
      '半数已完成，你比昨天的自己强了一点点。'
    ],
    high: [
      '快完成了，胜利就在眼前。',
      '就差几件了，坚持住！',
      '大部分都搞定了，你真棒。棒到可以吃个宵夜…吗？'
    ],
    done: [
      '全部完成！今天的你闪闪发光。',
      '清单清空，心情也清爽了。',
      '今日任务全部达成，给自己一个拥抱。'
    ],
    zero: [
      '还没开始？没关系，随时可以开始。',
      '清单空空，脑袋空空？快加几个任务吧。',
      '待办列表是空的，你今天打算躺平吗？'
    ]
  };

  // Render
  function render() {
    renderPending();
    renderCompleted();
    renderCommonTasks();
    updateProgress();
  }

  function renderPending() {
    const list = document.getElementById('pendingList');
    list.innerHTML = '';

    if (pendingTasks.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
          <div>暂无待办任务</div>
        </div>`;
      return;
    }

    pendingTasks.forEach((task, index) => {
      const item = document.createElement('div');
      item.className = 'todo-item';
      item.draggable = true;
      item.dataset.id = task.id;
      item.style.animationDelay = `${index * 0.05}s`;
      item.innerHTML = `
        <div class="drag-handle">
          <span></span><span></span><span></span>
        </div>
        <div class="checkbox" data-action="complete">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <div class="todo-text">${task.text}</div>
        <div class="delete-btn" data-action="delete">
          <svg viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </div>
      `;

      // Complete on checkbox click
      item.querySelector('.checkbox').addEventListener('click', (e) => {
        e.stopPropagation();
        completeTask(task.id);
      });

      // Delete on delete button click
      item.querySelector('.delete-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        deleteTask(task.id);
      });

      // Drag and drop
      item.addEventListener('dragstart', handleDragStart);
      item.addEventListener('dragover', handleDragOver);
      item.addEventListener('drop', handleDrop);
      item.addEventListener('dragend', handleDragEnd);

      list.appendChild(item);
    });
  }

  function renderCompleted() {
    const list = document.getElementById('completedList');
    list.innerHTML = '';

    if (completedTasks.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="8 12 11 15 16 9"></polyline></svg>
          <div>还没有完成的任务</div>
        </div>`;
      return;
    }

    completedTasks.forEach((task, index) => {
      const item = document.createElement('div');
      item.className = 'completed-item';
      item.style.animationDelay = `${index * 0.05}s`;
      item.innerHTML = `
        <div class="checkbox checked">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <div class="todo-text">${task.text}</div>
        <div class="complete-time">${task.completedAt}</div>
      `;
      item.addEventListener('click', () => uncompleteTask(task.id));
      list.appendChild(item);
    });
  }

  let isEditMode = false;
  let draggedChipId = null;
  let longPressTimer = null;

  function renderCommonTasks() {
    const grid = document.getElementById('commonTasks');
    // 保留 addChip
    const addChip = document.getElementById('addChipBtn');
    grid.innerHTML = '';
    grid.appendChild(addChip);

    commonTasks.forEach(task => {
      const chip = document.createElement('div');
      chip.className = 'task-chip';
      chip.dataset.id = task.id;
      chip.draggable = isEditMode;

      if (isEditMode) {
        chip.classList.add('edit-mode');
        chip.innerHTML = `
          ${task.text}
          <div class="chip-delete">×</div>
        `;
        // 删除按钮
        chip.querySelector('.chip-delete').addEventListener('click', (e) => {
          e.stopPropagation();
          deleteCommonTask(task.id);
        });
        // 拖拽排序
        chip.addEventListener('dragstart', handleChipDragStart);
        chip.addEventListener('dragover', handleChipDragOver);
        chip.addEventListener('drop', handleChipDrop);
        chip.addEventListener('dragend', handleChipDragEnd);

        // 长按触发拖拽提示
        chip.addEventListener('touchstart', (e) => {
          longPressTimer = setTimeout(() => {
            chip.style.transform = 'scale(1.05)';
            chip.style.boxShadow = '0 4px 12px rgba(0,0,0,0.15)';
          }, 500);
        });
        chip.addEventListener('touchend', () => {
          clearTimeout(longPressTimer);
          chip.style.transform = '';
          chip.style.boxShadow = '';
        });
        chip.addEventListener('touchmove', () => {
          clearTimeout(longPressTimer);
        });
      } else {
        chip.textContent = task.text;
        const orderIndex = selectedCommon.indexOf(task.id);
        if (orderIndex !== -1) {
          chip.classList.add('selected');
          chip.setAttribute('data-order', orderIndex + 1);
        }
        chip.addEventListener('click', () => toggleCommonTask(task.id));
      }

      grid.insertBefore(chip, addChip);
    });

    // 编辑模式下显示添加按钮
    addChip.classList.toggle('show', isEditMode);

    updateSelectedBar();
  }

  function toggleEditMode() {
    isEditMode = !isEditMode;
    const header = document.getElementById('commonTasksHeader');
    const hint = document.getElementById('commonHint');
    const manageLink = document.getElementById('manageLink');

    header.classList.toggle('edit-mode', isEditMode);

    if (isEditMode) {
      hint.textContent = '编辑模式 · 点击红叉删除 · 长按拖动排序';
      manageLink.textContent = '完成管理 ✓';
      selectedCommon = [];
    } else {
      hint.textContent = '多选 · 按点击顺序添加';
      manageLink.textContent = '管理常用任务 →';
    }

    renderCommonTasks();
  }

  function deleteCommonTask(id) {
    const index = commonTasks.findIndex(t => t.id === id);
    if (index !== -1) {
      commonTasks.splice(index, 1);
      renderCommonTasks();
    }
  }

  function addCommonTask(text) {
    const newId = 'c' + Date.now();
    commonTasks.push({ id: newId, text });
    renderCommonTasks();
  }

  // Chip drag and drop for reordering
  function handleChipDragStart(e) {
    draggedChipId = e.currentTarget.dataset.id;
    e.currentTarget.classList.add('dragging-chip');
  }
  function handleChipDragOver(e) {
    e.preventDefault();
    e.currentTarget.classList.add('drag-over-chip');
  }
  function handleChipDrop(e) {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over-chip');
    const targetId = e.currentTarget.dataset.id;
    if (draggedChipId === targetId) return;

    const fromIndex = commonTasks.findIndex(t => t.id === draggedChipId);
    const toIndex = commonTasks.findIndex(t => t.id === targetId);
    if (fromIndex === -1 || toIndex === -1) return;

    const [moved] = commonTasks.splice(fromIndex, 1);
    commonTasks.splice(toIndex, 0, moved);
    renderCommonTasks();
  }
  function handleChipDragEnd(e) {
    e.currentTarget.classList.remove('dragging-chip');
    document.querySelectorAll('.drag-over-chip').forEach(el => el.classList.remove('drag-over-chip'));
    draggedChipId = null;
  }

  function toggleCommonTask(id) {
    const index = selectedCommon.indexOf(id);
    if (index === -1) {
      selectedCommon.push(id);
    } else {
      selectedCommon.splice(index, 1);
    }
    renderCommonTasks();
  }

  function updateSelectedBar() {
    const bar = document.getElementById('selectedBar');
    const text = document.getElementById('selectedText');
    if (selectedCommon.length > 0) {
      bar.classList.add('show');
      text.textContent = `已选 ${selectedCommon.length} 项`;
    } else {
      bar.classList.remove('show');
    }
  }

  function completeTask(id) {
    const index = pendingTasks.findIndex(t => t.id === id);
    if (index === -1) return;
    const task = pendingTasks.splice(index, 1)[0];
    const now = new Date();
    const time = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    completedTasks.unshift({ ...task, completedAt: time });
    render();
  }

  function uncompleteTask(id) {
    const index = completedTasks.findIndex(t => t.id === id);
    if (index === -1) return;
    const task = completedTasks.splice(index, 1)[0];
    delete task.completedAt;
    pendingTasks.push(task);
    render();
  }

  function deleteTask(id) {
    const index = pendingTasks.findIndex(t => t.id === id);
    if (index === -1) return;
    pendingTasks.splice(index, 1);
    render();
  }

  function updateProgress() {
    const total = pendingTasks.length + completedTasks.length;
    const done = completedTasks.length;
    const percent = total === 0 ? 0 : Math.round((done / total) * 100);

    document.getElementById('progressCount').textContent = `${done} / ${total}`;
    document.getElementById('pendingCount').textContent = `${pendingTasks.length} 项`;
    document.getElementById('completedCount').textContent = `${completedTasks.length} 项`;
    document.getElementById('progressFill').style.width = `${percent}%`;

    const msgEl = document.getElementById('progressMessage');
    let msgArr;
    if (total === 0) msgArr = messages.zero;
    else if (done === total) msgArr = messages.done;
    else if (percent >= 70) msgArr = messages.high;
    else if (percent >= 40) msgArr = messages.mid;
    else msgArr = messages.low;
    msgEl.textContent = msgArr[Math.floor(Math.random() * msgArr.length)];
  }

  // Drag and drop
  let draggedId = null;

  function handleDragStart(e) {
    draggedId = parseInt(e.currentTarget.dataset.id);
    e.currentTarget.classList.add('dragging');
  }

  function handleDragOver(e) {
    e.preventDefault();
    e.currentTarget.classList.add('drag-over');
  }

  function handleDrop(e) {
    e.preventDefault();
    const targetId = parseInt(e.currentTarget.dataset.id);
    if (draggedId === targetId) return;

    const fromIndex = pendingTasks.findIndex(t => t.id === draggedId);
    const toIndex = pendingTasks.findIndex(t => t.id === targetId);

    const [moved] = pendingTasks.splice(fromIndex, 1);
    pendingTasks.splice(toIndex, 0, moved);

    renderPending();
  }

  function handleDragEnd(e) {
    e.currentTarget.classList.remove('dragging');
    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    draggedId = null;
  }

  // Modal
  const modal = document.getElementById('modal');
  document.getElementById('fab').addEventListener('click', () => {
    modal.classList.add('active');
    document.getElementById('taskInput').focus();
  });
  modal.addEventListener('click', (e) => {
    if (e.target === modal) {
      modal.classList.remove('active');
      selectedCommon = [];
      renderCommonTasks();
    }
  });

  // Quick add
  document.getElementById('quickAddBtn').addEventListener('click', quickAdd);
  document.getElementById('taskInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') quickAdd();
  });

  // Manage common tasks
  document.getElementById('manageLink').addEventListener('click', toggleEditMode);

  // Add new common task
  document.getElementById('addChipBtn').addEventListener('click', () => {
    const text = prompt('请输入常用任务名称：');
    if (text && text.trim()) {
      addCommonTask(text.trim());
    }
  });

  function quickAdd() {
    const input = document.getElementById('taskInput');
    const text = input.value.trim();
    if (!text) return;

    pendingTasks.push({ id: nextId++, text, order: pendingTasks.length });
    input.value = '';
    render();

    // Flash effect
    const list = document.getElementById('pendingList');
    const lastItem = list.lastElementChild;
    if (lastItem) {
      lastItem.style.background = 'var(--accent-bg)';
      setTimeout(() => { lastItem.style.background = ''; }, 500);
    }
  }

  // Add selected common tasks
  document.getElementById('addSelectedBtn').addEventListener('click', () => {
    selectedCommon.forEach(id => {
      const task = commonTasks.find(t => t.id === id);
      if (task) {
        pendingTasks.push({ id: nextId++, text: task.text, order: pendingTasks.length });
      }
    });
    selectedCommon = [];
    modal.classList.remove('active');
    render();
  });

  // 返回按钮逻辑
  function getQueryParam(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  function goBack() {
    const from = getQueryParam('from');
    const date = getQueryParam('date');
    if (from === 'detail' && date) {
      location.href = `04-detail.html?date=${date}`;
    } else {
      location.href = '01-calendar.html';
    }
  }

  // Initial render
  render();
</script>

</body>
</html>
