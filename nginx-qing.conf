server {
    listen 443 ssl;
    server_name qing6340.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/qing6340.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qing6340.duckdns.org/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sw.js {
        proxy_pass http://127.0.0.1:5000/sw.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
