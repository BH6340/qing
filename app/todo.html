<script>
// ===== State =====
let currentDate = '';
let pendingTasks = [];
let completedTasks = [];
let commonTasks = [];
let selectedCommon = []; // 选中的常用任务 id 列表（按点击顺序）
let isEditMode = false;
let draggedChipId = null;
let dragSrcIndex = null;

// ===== Init =====
function init() {
  Store.load();
  updateStatusTime();
  setInterval(updateStatusTime, 30000);

  // 读取日期参数
  const dateParam = Store.getQueryParam('date');
  if (dateParam) {
    currentDate = dateParam;
  } else {
    const now = new Date();
    currentDate = Store.dateKey(now);
  }

  // 更新标题
  const [y, m, d] = currentDate.split('-');
  const dateObj = new Date(y, m - 1, d);
  const weekday = Store.getWeekday(dateObj);
  const isToday = Store.isToday(dateObj);
  document.getElementById('pageDate').textContent = `${m}月${d}日`;
  document.getElementById('pageWeekday').textContent = `${weekday}${isToday ? ' · 今天' : ''}`;

  loadData();
  render();

  // 事件绑定
  document.getElementById('taskInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') quickAdd();
  });
  document.getElementById('manageBtn').addEventListener('click', toggleEditMode);
  document.getElementById('addChipBtn').addEventListener('click', addNewCommonTask);
  document.getElementById('drawerOverlay').addEventListener('click', closeDrawer);

  // bfcache 恢复时重新加载数据
  window.addEventListener('pageshow', (e) => {
    if (e.persisted) {
      Store.reload();
      loadData();
      render();
    }
  });

  // 拖拽关闭抽屉
  let touchStartY = 0;
  const drawerHandle = document.querySelector('.common-drawer-handle');
  drawerHandle.addEventListener('touchstart', (e) => {
    touchStartY = e.touches[0].clientY;
  });
  drawerHandle.addEventListener('touchmove', (e) => {
    const diff = e.touches[0].clientY - touchStartY;
    if (diff > 50) {
      closeDrawer();
    }
  });
}

function updateStatusTime() {
  const now = new Date();
  const h = now.getHours();
  const m = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('statusTime').textContent = `${h}:${m}`;
}

function goBack() {
  const from = Store.getQueryParam('from');
  const date = Store.getQueryParam('date');
  if (from === 'detail' && date) {
    location.href = `detail.html?date=${date}`;
  } else {
    location.href = 'index.html';
  }
}

// ===== Data =====
function loadData() {
  const tasks = Store.getTasks(currentDate);
  pendingTasks = tasks.filter(t => !t.completed).sort((a, b) => a.order - b.order);
  completedTasks = tasks.filter(t => t.completed).sort((a, b) => (b.completedAt || '').localeCompare(a.completedAt || ''));
  commonTasks = Store.getCommonTasks();
}

function saveTasks() {
  const all = [...pendingTasks, ...completedTasks];
  Store.setTasks(currentDate, all);
}

// ===== Render =====
function render() {
  renderPending();
  renderDone();
  renderCommonBar();
  renderCommonTasks();
  updateProgress();
  updateDrawerFooter();
}

function renderPending() {
  const list = document.getElementById('pendingList');
  document.getElementById('pendingBadge').textContent = pendingTasks.length;

  if (pendingTasks.length === 0) {
    list.innerHTML = `<div class="empty-tasks">
      <div class="emoji">✨</div>
      还没有待办任务<br>快速添加，或从常用任务中选择
    </div>`;
    return;
  }

  list.innerHTML = '';
  pendingTasks.forEach((task, index) => {
    const item = document.createElement('div');
    item.className = 'todo-item';
    item.draggable = true;
    item.dataset.id = task.id;
    item.dataset.index = index;

    item.innerHTML = `
      <div class="drag-handle">
        <span></span><span></span><span></span>
      </div>
      <div class="checkbox">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
      <div class="todo-text">${escapeHtml(task.text)}</div>
      <div class="delete-btn">
        <svg viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </div>
    `;

    // Complete
    item.querySelector('.checkbox').addEventListener('click', () => completeTask(task.id));

    // Delete
    item.querySelector('.delete-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      deleteTask(task.id);
    });

    // Drag
    item.addEventListener('dragstart', handleDragStart);
    item.addEventListener('dragover', handleDragOver);
    item.addEventListener('drop', handleDrop);
    item.addEventListener('dragend', handleDragEnd);

    list.appendChild(item);
  });

  document.getElementById('pendingBadge').textContent = pendingTasks.length;
}

function renderDone() {
  const list = document.getElementById('doneList');

  if (completedTasks.length === 0) {
    list.innerHTML = `<div class="empty-tasks" style="padding: 20px;">
      <div class="emoji" style="font-size:24px;">🌱</div>
      完成的任务会出现在这里
    </div>`;
    document.getElementById('doneBadge').textContent = '0';
    return;
  }

  list.innerHTML = '';
  completedTasks.forEach(task => {
    const item = document.createElement('div');
    item.className = 'todo-item completed';

    item.innerHTML = `
      <div class="checkbox">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
      <div class="todo-text">${escapeHtml(task.text)}</div>
      <div class="todo-time">${task.completedAt || ''}</div>
    `;

    item.addEventListener('click', () => uncompleteTask(task.id));
    list.appendChild(item);
  });

  document.getElementById('doneBadge').textContent = completedTasks.length;
}

function updateProgress() {
  const total = pendingTasks.length + completedTasks.length;
  const done = completedTasks.length;
  const percent = total === 0 ? 0 : Math.round((done / total) * 100);

  document.getElementById('doneCount').textContent = done;
  document.getElementById('totalCount').textContent = total;
  document.getElementById('progressFill').style.width = percent + '%';
  document.getElementById('progressMsg').textContent = Messages.getProgressMessage(total, done);
}

// ===== Task Actions =====
function quickAdd() {
  const input = document.getElementById('taskInput');
  const text = input.value.trim();
  if (!text) return;

  Store.addTask(currentDate, text);
  input.value = '';
  loadData();
  render();
  Store.toast('任务已添加');
}

function completeTask(id) {
  Store.completeTask(currentDate, id);
  loadData();
  render();
  Store.toast(Messages.getTaskComplete());
}

function uncompleteTask(id) {
  Store.uncompleteTask(currentDate, id);
  loadData();
  render();
}

function deleteTask(id) {
  Store.deleteTask(currentDate, id);
  loadData();
  render();
  Store.toast('已删除');
}

// ===== Drag and Drop (pending reorder) =====
function handleDragStart(e) {
  dragSrcIndex = parseInt(e.currentTarget.dataset.index);
  e.currentTarget.classList.add('dragging');
}
function handleDragOver(e) {
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
}
function handleDrop(e) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const targetIndex = parseInt(e.currentTarget.dataset.index);
  if (dragSrcIndex === null || dragSrcIndex === targetIndex) return;

  Store.reorderTasks(currentDate, dragSrcIndex, targetIndex);
  loadData();
  render();
}
function handleDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
  dragSrcIndex = null;
}

// ===== Common Tasks =====
function renderCommonBar() {
  const container = document.getElementById('commonBarContainer');
  if (commonTasks.length === 0) {
    container.innerHTML = `
      <div class="common-bar-empty" onclick="openDrawer()">
        还没有常用任务，点击添加 →
      </div>
    `;
  } else {
    container.innerHTML = `
      <div class="common-bar" id="commonBar" onclick="openDrawer()">
        <div class="left">
          <span class="label">常用任务</span>
          <span class="count">${commonTasks.length} 个</span>
        </div>
        <div class="chev">
          <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
      </div>
    `;
  }
}

function openDrawer() {
  const drawer = document.getElementById('commonDrawer');
  const overlay = document.getElementById('drawerOverlay');
  drawer.classList.add('open');
  overlay.style.background = 'rgba(0,0,0,0.3)';
  overlay.style.pointerEvents = 'auto';
  const bar = document.getElementById('commonBar');
  if (bar) bar.classList.add('open');
}

function closeDrawer() {
  const drawer = document.getElementById('commonDrawer');
  const overlay = document.getElementById('drawerOverlay');
  drawer.classList.remove('open');
  overlay.style.background = 'rgba(0,0,0,0)';
  overlay.style.pointerEvents = 'none';
  const bar = document.getElementById('commonBar');
  if (bar) bar.classList.remove('open');
  // 退出编辑模式
  if (isEditMode) {
    isEditMode = false;
    updateEditModeUI();
    renderCommonTasks();
  }
}

function renderCommonTasks() {
  const grid = document.getElementById('commonTasks');
  const addChip = document.getElementById('addChipBtn');
  const emptyEl = document.getElementById('commonEmpty');

  grid.innerHTML = '';
  grid.appendChild(addChip);

  if (commonTasks.length === 0) {
    grid.style.display = 'none';
    emptyEl.style.display = 'block';
    addChip.classList.toggle('show', isEditMode);
    if (isEditMode) {
      grid.style.display = 'flex';
      emptyEl.style.display = 'none';
    }
    return;
  }

  grid.style.display = 'flex';
  emptyEl.style.display = 'none';

  commonTasks.forEach((task, index) => {
    const chip = document.createElement('div');
    chip.className = 'task-chip';
    chip.dataset.id = task.id;
    chip.dataset.index = index;
    chip.draggable = isEditMode;

    if (isEditMode) {
      chip.classList.add('edit-mode');
      chip.innerHTML = `
        ${escapeHtml(task.text)}
        <div class="chip-delete">×</div>
      `;
      // Delete
      chip.querySelector('.chip-delete').addEventListener('click', (e) => {
        e.stopPropagation();
        deleteCommonTask(task.id);
      });
      // Drag
      chip.addEventListener('dragstart', handleChipDragStart);
      chip.addEventListener('dragover', handleChipDragOver);
      chip.addEventListener('drop', handleChipDrop);
      chip.addEventListener('dragend', handleChipDragEnd);
    } else {
      chip.textContent = task.text;
      const orderIndex = selectedCommon.indexOf(task.id);
      if (orderIndex !== -1) {
        chip.classList.add('selected');
        chip.setAttribute('data-order', orderIndex + 1);
      }
      chip.addEventListener('click', () => toggleCommonTask(task.id));
    }

    grid.insertBefore(chip, addChip);
  });

  addChip.classList.toggle('show', isEditMode);
}

function toggleCommonTask(id) {
  const index = selectedCommon.indexOf(id);
  if (index === -1) {
    selectedCommon.push(id);
  } else {
    selectedCommon.splice(index, 1);
  }
  renderCommonTasks();
  updateDrawerFooter();
}

function updateDrawerFooter() {
  const count = selectedCommon.length;
  document.getElementById('selectedCount').textContent = count;
  const btn = document.getElementById('addSelectedBtn');
  btn.disabled = count === 0;
}

function addSelectedTasks() {
  if (selectedCommon.length === 0) return;
  const count = selectedCommon.length;
  Store.addCommonTasksToDate(currentDate, selectedCommon);
  selectedCommon = [];
  loadData();
  render();
  closeDrawer();
  Store.toast(`已添加 ${count} 个任务`);
}

// ===== Edit Mode =====
function toggleEditMode() {
  isEditMode = !isEditMode;
  updateEditModeUI();
  renderCommonTasks();
  updateDrawerFooter();
}

function updateEditModeUI() {
  const header = document.getElementById('drawerHeader');
  const hint = document.getElementById('drawerHint');
  const manageBtn = document.getElementById('manageBtn');

  header.classList.toggle('edit-mode', isEditMode);

  if (isEditMode) {
    hint.textContent = '编辑模式 · 点击红叉删除 · 拖动排序';
    manageBtn.textContent = '完成';
    selectedCommon = [];
  } else {
    hint.textContent = '多选 · 按点击顺序添加';
    manageBtn.textContent = '管理';
  }
}

function deleteCommonTask(id) {
  Store.deleteCommonTask(id);
  commonTasks = Store.getCommonTasks();
  renderCommonBar();
  renderCommonTasks();
  Store.toast('已删除');
}

function addNewCommonTask() {
  const text = prompt('请输入常用任务名称：');
  if (text && text.trim()) {
    Store.addCommonTask(text.trim());
    commonTasks = Store.getCommonTasks();
    renderCommonBar();
    renderCommonTasks();
    Store.toast('已添加');
  }
}

// Chip drag
function handleChipDragStart(e) {
  draggedChipId = e.currentTarget.dataset.id;
  e.currentTarget.classList.add('dragging');
}
function handleChipDragOver(e) {
  e.preventDefault();
  e.currentTarget.classList.add('drag-over-chip');
}
function handleChipDrop(e) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over-chip');
  const targetId = e.currentTarget.dataset.id;
  if (draggedChipId === targetId) return;

  const fromIndex = commonTasks.findIndex(t => t.id === draggedChipId);
  const toIndex = commonTasks.findIndex(t => t.id === targetId);
  if (fromIndex === -1 || toIndex === -1) return;

  Store.reorderCommonTasks(fromIndex, toIndex);
  commonTasks = Store.getCommonTasks();
  renderCommonTasks();
}
function handleChipDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.drag-over-chip').forEach(el => el.classList.remove('drag-over-chip'));
  draggedChipId = null;
}

// ===== Utils =====
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// Start
init();
</script>

</body>
</html>
