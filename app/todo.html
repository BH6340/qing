<script>
// ===== State =====
let currentDate = '';
let pendingTasks = [];
let completedTasks = [];
let commonTasks = [];
let selectedCommon = [];
let isEditMode = false;

// Touch drag state
let touchDrag = {
  active: false,
  longPressTimer: null,
  startX: 0,
  startY: 0,
  taskId: null,
  listType: null, // 'pending' or 'common'
  ghost: null,
  overIndex: null
};

// Time picker state for completed tasks
let timePicker = {
  taskId: null,
  hour: 0,
  minute: 0
};
const TIME_PICKER_ITEM_H = 36;

// ===== Init =====
function init() {
  Store.load();

  const dateParam = Store.getQueryParam('date');
  if (dateParam) {
    currentDate = dateParam;
  } else {
    const now = new Date();
    currentDate = Store.dateKey(now);
  }

  const [y, m, d] = currentDate.split('-');
  const dateObj = new Date(y, m - 1, d);
  const weekday = Store.getWeekday(dateObj);
  const isToday = Store.isToday(dateObj);
  document.getElementById('pageDate').textContent = `${m}月${d}日`;
  document.getElementById('pageWeekday').textContent = `${weekday}${isToday ? ' · 今天' : ''}`;

  loadData();
  render();

  document.getElementById('taskInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') quickAdd();
  });
  document.getElementById('manageBtn').addEventListener('click', toggleEditMode);
  document.getElementById('drawerOverlay').addEventListener('click', closeDrawer);
  document.getElementById('newTaskInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') addNewCommonTask();
  });

  // Time modal overlay click
  document.getElementById('timeModal').addEventListener('click', (e) => {
    if (e.target.id === 'timeModal') closeTimeModal();
  });

  window.addEventListener('pageshow', (e) => {
    if (e.persisted) {
      Store.reload();
      loadData();
      render();
    }
  });

  // Drawer handle drag close
  let touchStartY = 0;
  const drawerHandle = document.querySelector('.common-drawer-handle');
  drawerHandle.addEventListener('touchstart', (e) => {
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  drawerHandle.addEventListener('touchmove', (e) => {
    const diff = e.touches[0].clientY - touchStartY;
    if (diff > 50) closeDrawer();
  }, { passive: true });
}

function goBack() {
  const from = Store.getQueryParam('from');
  const date = Store.getQueryParam('date');
  if (from === 'detail' && date) {
    location.href = `detail.html?date=${date}&from=index`;
  } else {
    location.href = 'index.html';
  }
}

// ===== Data =====
function loadData() {
  const tasks = Store.getTasks(currentDate);
  pendingTasks = tasks.filter(t => !t.completed).sort((a, b) => a.order - b.order);
  completedTasks = tasks.filter(t => t.completed).sort((a, b) => (b.completedAt || '').localeCompare(a.completedAt || ''));
  commonTasks = Store.getCommonTasks();
}

function saveTasks() {
  const all = [...pendingTasks, ...completedTasks];
  Store.setTasks(currentDate, all);
}

// ===== Render =====
function render() {
  renderPending();
  renderDone();
  renderCommonBar();
  renderCommonTasks();
  updateProgress();
  updateDrawerFooter();
}

function renderPending() {
  const list = document.getElementById('pendingList');
  document.getElementById('pendingBadge').textContent = pendingTasks.length;

  if (pendingTasks.length === 0) {
    list.innerHTML = `<div class="empty-tasks">
      <div class="emoji">✨</div>
      还没有待办任务<br>快速添加，或从常用任务中选择
    </div>`;
    return;
  }

  list.innerHTML = '';
  pendingTasks.forEach((task, index) => {
    const item = document.createElement('div');
    item.className = 'todo-item';
    item.draggable = true;
    item.dataset.id = task.id;
    item.dataset.index = index;

    item.innerHTML = `
      <div class="drag-handle">
        <span></span><span></span><span></span>
      </div>
      <div class="checkbox">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
      <div class="todo-text">${escapeHtml(task.text)}</div>
      <div class="delete-btn">
        <svg viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </div>
    `;

    // Complete
    item.querySelector('.checkbox').addEventListener('click', () => completeTask(task.id));

    // Edit text
    item.querySelector('.todo-text').addEventListener('click', (e) => {
      e.stopPropagation();
      startEditTask(item, task, 'pending');
    });

    // Delete
    item.querySelector('.delete-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      deleteTask(task.id);
    });

    // Drag (HTML5 for desktop)
    item.addEventListener('dragstart', handleDragStart);
    item.addEventListener('dragover', handleDragOver);
    item.addEventListener('drop', handleDrop);
    item.addEventListener('dragend', handleDragEnd);

    // Touch drag on handle
    const handle = item.querySelector('.drag-handle');
    handle.addEventListener('touchstart', (e) => {
      e.preventDefault();
      startTouchDrag(e, task.id, index, 'pending', item);
    }, { passive: false });

    list.appendChild(item);
  });

  document.getElementById('pendingBadge').textContent = pendingTasks.length;
}

function renderDone() {
  const list = document.getElementById('doneList');

  if (completedTasks.length === 0) {
    list.innerHTML = `<div class="empty-tasks" style="padding: 20px;">
      <div class="emoji" style="font-size:24px;">🌱</div>
      完成的任务会出现在这里
    </div>`;
    document.getElementById('doneBadge').textContent = '0';
    return;
  }

  list.innerHTML = '';
  completedTasks.forEach(task => {
    const item = document.createElement('div');
    item.className = 'todo-item completed';
    item.dataset.id = task.id;

    item.innerHTML = `
      <div class="checkbox">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
      <div class="todo-text">${escapeHtml(task.text)}</div>
      <div class="todo-time">${task.completedAt || ''}</div>
      <div class="delete-btn">
        <svg viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </div>
    `;

    // Uncomplete
    item.querySelector('.checkbox').addEventListener('click', (e) => {
      e.stopPropagation();
      uncompleteTask(task.id);
    });

    // Edit text
    item.querySelector('.todo-text').addEventListener('click', (e) => {
      e.stopPropagation();
      startEditTask(item, task, 'completed');
    });

    // Change time
    item.querySelector('.todo-time').addEventListener('click', (e) => {
      e.stopPropagation();
      openTimeModal(task.id);
    });

    // Delete
    item.querySelector('.delete-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      deleteTask(task.id);
    });

    list.appendChild(item);
  });

  document.getElementById('doneBadge').textContent = completedTasks.length;
}

// ===== Inline task edit =====
function startEditTask(itemEl, task, listType) {
  const textEl = itemEl.querySelector('.todo-text');
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'todo-edit-input';
  input.value = task.text;
  input.maxLength = 50;

  textEl.replaceWith(input);
  input.focus();
  input.select();

  function save() {
    const newText = input.value.trim();
    if (newText && newText !== task.text) {
      Store.updateTask(currentDate, task.id, { text: newText });
      loadData();
      render();
    } else {
      // Restore text
      input.replaceWith(textEl);
    }
  }

  function cancel() {
    input.replaceWith(textEl);
  }

  input.addEventListener('blur', save);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      input.blur();
    } else if (e.key === 'Escape') {
      cancel();
    }
    e.stopPropagation();
  });

  input.addEventListener('click', (e) => e.stopPropagation());
}

function updateProgress() {
  const total = pendingTasks.length + completedTasks.length;
  const done = completedTasks.length;
  const percent = total === 0 ? 0 : Math.round((done / total) * 100);

  document.getElementById('doneCount').textContent = done;
  document.getElementById('totalCount').textContent = total;
  document.getElementById('progressFill').style.width = percent + '%';
  document.getElementById('progressMsg').textContent = Messages.getProgressMessage(total, done);
}

// ===== Task Actions =====
function quickAdd() {
  const input = document.getElementById('taskInput');
  const text = input.value.trim();
  if (!text) return;

  Store.addTask(currentDate, text);
  input.value = '';
  loadData();
  render();
  Store.toast('任务已添加');
}

function completeTask(id) {
  Store.completeTask(currentDate, id);
  loadData();
  render();
  Store.toast(Messages.getTaskComplete());
}

function uncompleteTask(id) {
  Store.uncompleteTask(currentDate, id);
  loadData();
  render();
}

function deleteTask(id) {
  Store.deleteTask(currentDate, id);
  loadData();
  render();
  Store.toast('已删除');
}

// ===== Drag and Drop (pending reorder) =====
let dragSrcIndex = null;

function handleDragStart(e) {
  dragSrcIndex = parseInt(e.currentTarget.dataset.index);
  e.currentTarget.classList.add('dragging');
}
function handleDragOver(e) {
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
}
function handleDrop(e) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const targetIndex = parseInt(e.currentTarget.dataset.index);
  if (dragSrcIndex === null || dragSrcIndex === targetIndex) return;

  Store.reorderTasks(currentDate, dragSrcIndex, targetIndex);
  loadData();
  render();
}
function handleDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
  dragSrcIndex = null;
}

// ===== Touch Drag (mobile) =====
function startTouchDrag(e, taskId, srcIndex, listType, itemEl) {
  const touch = e.touches[0];
  touchDrag.startX = touch.clientX;
  touchDrag.startY = touch.clientY;
  touchDrag.taskId = taskId;
  touchDrag.listType = listType;
  touchDrag.active = false;
  touchDrag.overIndex = null;

  // Long press 500ms to start drag
  touchDrag.longPressTimer = setTimeout(() => {
    touchDrag.active = true;

    // Create ghost element
    const rect = itemEl.getBoundingClientRect();
    const ghost = itemEl.cloneNode(true);
    ghost.className = 'todo-item drag-ghost';
    ghost.style.width = rect.width + 'px';
    ghost.style.left = rect.left + 'px';
    ghost.style.top = rect.top + 'px';
    ghost.style.background = 'var(--card)';
    ghost.style.borderRadius = 'var(--radius-lg)';
    ghost.style.padding = '14px 16px';
    document.body.appendChild(ghost);
    touchDrag.ghost = ghost;

    itemEl.classList.add('dragging');

    // Vibrate if supported
    if (navigator.vibrate) navigator.vibrate(30);
  }, 500);

  // Move
  function onTouchMove(ev) {
    const t = ev.touches[0];
    const diffX = Math.abs(t.clientX - touchDrag.startX);
    const diffY = Math.abs(t.clientY - touchDrag.startY);

    // Cancel long press if moved too much before activation
    if (!touchDrag.active && (diffX > 10 || diffY > 10)) {
      clearTimeout(touchDrag.longPressTimer);
      cleanup();
      return;
    }

    if (!touchDrag.active) return;
    ev.preventDefault();

    // Move ghost
    const rect = touchDrag.ghost.getBoundingClientRect();
    touchDrag.ghost.style.left = (t.clientX - rect.width / 2) + 'px';
    touchDrag.ghost.style.top = (t.clientY - rect.height / 2) + 'px';

    // Detect drop target
    if (listType === 'pending') {
      const items = document.querySelectorAll('#pendingList .todo-item');
      let found = false;
      items.forEach((item, idx) => {
        const r = item.getBoundingClientRect();
        const midY = r.top + r.height / 2;
        item.classList.remove('drag-over');
        if (t.clientY >= r.top && t.clientY <= r.bottom) {
          item.classList.add('drag-over');
          touchDrag.overIndex = idx;
          found = true;
        }
      });
      if (!found) touchDrag.overIndex = null;
    }
  }

  // End
  function onTouchEnd(ev) {
    clearTimeout(touchDrag.longPressTimer);

    if (touchDrag.active && listType === 'pending' && touchDrag.overIndex !== null) {
      Store.reorderTasks(currentDate, srcIndex, touchDrag.overIndex);
      loadData();
      render();
    }

    cleanup();
  }

  function cleanup() {
    if (touchDrag.ghost) {
      touchDrag.ghost.remove();
      touchDrag.ghost = null;
    }
    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    document.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
    touchDrag.active = false;
    document.removeEventListener('touchmove', onTouchMove);
    document.removeEventListener('touchend', onTouchEnd);
  }

  document.addEventListener('touchmove', onTouchMove, { passive: false });
  document.addEventListener('touchend', onTouchEnd, { passive: true });
}

// ===== Time Picker for completed tasks =====
function initTimePicker() {
  const hourPicker = document.getElementById('doneHourPicker');
  const minutePicker = document.getElementById('doneMinutePicker');

  // Hours
  hourPicker.innerHTML = `<div style="height: 12px;"></div>`;
  for (let i = 0; i <= 23; i++) {
    const item = document.createElement('div');
    item.className = 'picker-item';
    item.dataset.value = i;
    item.textContent = String(i).padStart(2, '0');
    item.addEventListener('click', () => scrollDoneHourTo(i));
    hourPicker.appendChild(item);
  }
  hourPicker.innerHTML += `<div style="height: 12px;"></div>`;

  // Minutes
  minutePicker.innerHTML = `<div style="height: 12px;"></div>`;
  for (let i = 0; i <= 59; i++) {
    const item = document.createElement('div');
    item.className = 'picker-item';
    item.dataset.value = i;
    item.textContent = String(i).padStart(2, '0');
    item.addEventListener('click', () => scrollDoneMinuteTo(i));
    minutePicker.appendChild(item);
  }
  minutePicker.innerHTML += `<div style="height: 12px;"></div>`;

  hourPicker.addEventListener('scroll', () => updateDoneHourSelection());
  minutePicker.addEventListener('scroll', () => updateDoneMinuteSelection());

  // Snap to nearest on scroll end
  let hourScrollTimer, minuteScrollTimer;
  hourPicker.addEventListener('scroll', () => {
    clearTimeout(hourScrollTimer);
    hourScrollTimer = setTimeout(() => {
      const idx = Math.max(0, Math.min(23, Math.round(hourPicker.scrollTop / TIME_PICKER_ITEM_H)));
      hourPicker.scrollTo({ top: idx * TIME_PICKER_ITEM_H, behavior: 'smooth' });
    }, 120);
  });
  minutePicker.addEventListener('scroll', () => {
    clearTimeout(minuteScrollTimer);
    minuteScrollTimer = setTimeout(() => {
      const idx = Math.max(0, Math.min(59, Math.round(minutePicker.scrollTop / TIME_PICKER_ITEM_H)));
      minutePicker.scrollTo({ top: idx * TIME_PICKER_ITEM_H, behavior: 'smooth' });
    }, 120);
  });
}

function scrollDoneHourTo(val) {
  const col = document.getElementById('doneHourPicker');
  col.scrollTo({ top: val * TIME_PICKER_ITEM_H, behavior: 'smooth' });
}
function scrollDoneMinuteTo(val) {
  const col = document.getElementById('doneMinutePicker');
  col.scrollTo({ top: val * TIME_PICKER_ITEM_H, behavior: 'smooth' });
}
function updateDoneHourSelection() {
  const col = document.getElementById('doneHourPicker');
  let index = Math.round(col.scrollTop / TIME_PICKER_ITEM_H);
  index = Math.max(0, Math.min(23, index));
  col.querySelectorAll('.picker-item').forEach((item, i) => item.classList.toggle('selected', i === index));
  timePicker.hour = index;
}
function updateDoneMinuteSelection() {
  const col = document.getElementById('doneMinutePicker');
  let index = Math.round(col.scrollTop / TIME_PICKER_ITEM_H);
  index = Math.max(0, Math.min(59, index));
  col.querySelectorAll('.picker-item').forEach((item, i) => item.classList.toggle('selected', i === index));
  timePicker.minute = index;
}

function openTimeModal(taskId) {
  const task = completedTasks.find(t => t.id === taskId);
  if (!task) return;
  timePicker.taskId = taskId;

  // Parse completedAt "HH:MM"
  if (task.completedAt) {
    const parts = task.completedAt.split(':');
    timePicker.hour = parseInt(parts[0], 10) || 0;
    timePicker.minute = parseInt(parts[1], 10) || 0;
  } else {
    const now = new Date();
    timePicker.hour = now.getHours();
    timePicker.minute = now.getMinutes();
  }

  document.getElementById('timeModalTask').textContent = task.text;
  document.getElementById('timeModal').classList.add('active');

  setTimeout(() => {
    document.getElementById('doneHourPicker').scrollTop = timePicker.hour * TIME_PICKER_ITEM_H;
    document.getElementById('doneMinutePicker').scrollTop = timePicker.minute * TIME_PICKER_ITEM_H;
    updateDoneHourSelection();
    updateDoneMinuteSelection();
  }, 50);
}

function closeTimeModal() {
  document.getElementById('timeModal').classList.remove('active');
}

function saveTimeModal() {
  const h = Math.max(0, Math.min(23, timePicker.hour));
  const m = Math.max(0, Math.min(59, timePicker.minute));
  const timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
  Store.updateTask(currentDate, timePicker.taskId, { completedAt: timeStr });
  loadData();
  render();
  closeTimeModal();
  Store.toast('时间已修改');
}

// ===== Common Tasks =====
function renderCommonBar() {
  const container = document.getElementById('commonBarContainer');
  if (commonTasks.length === 0) {
    container.innerHTML = `
      <div class="common-bar-empty" onclick="openDrawer()">
        还没有常用任务，点击添加 →
      </div>
    `;
  } else {
    container.innerHTML = `
      <div class="common-bar" id="commonBar" onclick="openDrawer()">
        <div class="left">
          <span class="label">常用任务</span>
          <span class="count">${commonTasks.length} 个</span>
        </div>
        <div class="chev">
          <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
      </div>
    `;
  }
}

function openDrawer() {
  const drawer = document.getElementById('commonDrawer');
  const overlay = document.getElementById('drawerOverlay');
  drawer.classList.add('open');
  overlay.style.background = 'rgba(0,0,0,0.3)';
  overlay.style.pointerEvents = 'auto';
  const bar = document.getElementById('commonBar');
  if (bar) bar.classList.add('open');
}

function closeDrawer() {
  const drawer = document.getElementById('commonDrawer');
  const overlay = document.getElementById('drawerOverlay');
  drawer.classList.remove('open');
  overlay.style.background = 'rgba(0,0,0,0)';
  overlay.style.pointerEvents = 'none';
  const bar = document.getElementById('commonBar');
  if (bar) bar.classList.remove('open');
  if (isEditMode) {
    isEditMode = false;
    updateEditModeUI();
    renderCommonTasks();
  }
}

function renderCommonTasks() {
  const grid = document.getElementById('commonTasks');
  const emptyEl = document.getElementById('commonEmpty');
  const addRow = document.getElementById('addTaskRow');

  grid.innerHTML = '';

  if (commonTasks.length === 0) {
    grid.style.display = 'none';
    emptyEl.style.display = 'block';
    addRow.style.display = isEditMode ? 'flex' : 'none';
    return;
  }

  grid.style.display = 'flex';
  emptyEl.style.display = 'none';
  addRow.style.display = isEditMode ? 'flex' : 'none';

  commonTasks.forEach((task, index) => {
    const chip = document.createElement('div');
    chip.className = 'task-chip';
    chip.dataset.id = task.id;
    chip.dataset.index = index;

    if (isEditMode) {
      chip.classList.add('edit-mode');
      chip.innerHTML = `
        ${escapeHtml(task.text)}
        <div class="chip-delete">×</div>
      `;
      chip.querySelector('.chip-delete').addEventListener('click', (e) => {
        e.stopPropagation();
        deleteCommonTask(task.id);
      });
      // Touch drag for chips
      chip.addEventListener('touchstart', (e) => {
        startChipTouchDrag(e, task.id, index);
      }, { passive: true });
    } else {
      chip.textContent = task.text;
      const orderIndex = selectedCommon.indexOf(task.id);
      if (orderIndex !== -1) {
        chip.classList.add('selected');
        chip.setAttribute('data-order', orderIndex + 1);
      }
      chip.addEventListener('click', () => toggleCommonTask(task.id));
    }

    grid.appendChild(chip);
  });
}

function toggleCommonTask(id) {
  const index = selectedCommon.indexOf(id);
  if (index === -1) {
    selectedCommon.push(id);
  } else {
    selectedCommon.splice(index, 1);
  }
  renderCommonTasks();
  updateDrawerFooter();
}

function updateDrawerFooter() {
  const count = selectedCommon.length;
  document.getElementById('selectedCount').textContent = count;
  const btn = document.getElementById('addSelectedBtn');
  btn.disabled = count === 0;
}

function addSelectedTasks() {
  if (selectedCommon.length === 0) return;
  const count = selectedCommon.length;
  Store.addCommonTasksToDate(currentDate, selectedCommon);
  selectedCommon = [];
  loadData();
  render();
  closeDrawer();
  Store.toast(`已添加 ${count} 个任务`);
}

// ===== Edit Mode =====
function toggleEditMode() {
  isEditMode = !isEditMode;
  updateEditModeUI();
  renderCommonTasks();
  updateDrawerFooter();
}

function updateEditModeUI() {
  const header = document.getElementById('drawerHeader');
  const hint = document.getElementById('drawerHint');
  const manageBtn = document.getElementById('manageBtn');

  header.classList.toggle('edit-mode', isEditMode);

  if (isEditMode) {
    hint.textContent = '编辑模式 · 点红叉删除 · 长按拖动排序';
    manageBtn.textContent = '完成';
    selectedCommon = [];
  } else {
    hint.textContent = '多选 · 按点击顺序添加';
    manageBtn.textContent = '管理';
  }
}

function deleteCommonTask(id) {
  Store.deleteCommonTask(id);
  commonTasks = Store.getCommonTasks();
  renderCommonBar();
  renderCommonTasks();
  Store.toast('已删除');
}

function addNewCommonTask() {
  const input = document.getElementById('newTaskInput');
  const text = input.value.trim();
  if (!text) return;
  Store.addCommonTask(text);
  commonTasks = Store.getCommonTasks();
  renderCommonBar();
  renderCommonTasks();
  input.value = '';
  Store.toast('已添加');
}

// Touch drag for chips (simplified)
let chipDrag = { active: false, srcId: null, srcIdx: null, timer: null };

function startChipTouchDrag(e, taskId, srcIdx) {
  const touch = e.touches[0];
  const startX = touch.clientX;
  const startY = touch.clientY;

  chipDrag.timer = setTimeout(() => {
    chipDrag.active = true;
    chipDrag.srcId = taskId;
    chipDrag.srcIdx = srcIdx;
    if (navigator.vibrate) navigator.vibrate(30);
  }, 500);

  function onMove(ev) {
    const t = ev.touches[0];
    if (!chipDrag.active) {
      if (Math.abs(t.clientX - startX) > 10 || Math.abs(t.clientY - startY) > 10) {
        clearTimeout(chipDrag.timer);
        cleanup();
      }
    }
  }

  function onEnd() {
    clearTimeout(chipDrag.timer);
    if (chipDrag.active && chipDrag.srcId) {
      // For simplicity, just re-render
      chipDrag.active = false;
    }
    cleanup();
  }

  function cleanup() {
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onEnd);
  }

  document.addEventListener('touchmove', onMove, { passive: true });
  document.addEventListener('touchend', onEnd, { passive: true });
}

// ===== Utils =====
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// Start
initTimePicker();
init();
</script>
