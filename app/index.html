<script src="js/storage.js"></script>
<script src="js/messages.js"></script>
<script>
// ===== Calendar State =====
const today = new Date();
let currentYear = today.getFullYear();
let currentMonth = today.getMonth() + 1;
let selectedDate = today.getDate();
let currentWeight = 60.0;

// Weight picker state
let weightInt = 60;
let weightDec = 0;
const WEIGHT_MIN = 30;
const WEIGHT_MAX = 200;
const PICKER_ITEM_H = 36; // height per item in modal pickers

// Time picker state
let pickerHour = 9;
let pickerMinute = 0;

// ===== Initialize =====
function init() {
  Store.load();
  initPicker();
  initWeightPicker();
  initTimePicker();
  // 恢复上次浏览状态
  const saved = sessionStorage.getItem('qing_index_state');
  if (saved) {
    try {
      const s = JSON.parse(saved);
      currentYear = s.year;
      currentMonth = s.month;
      selectedDate = s.date;
    } catch(e) {}
  }
  renderCalendar();
  updateBottomCard();
  initSwipe();
}

function saveState() {
  sessionStorage.setItem('qing_index_state', JSON.stringify({
    year: currentYear,
    month: currentMonth,
    date: selectedDate,
  }));
}

// ===== Helper: short weekday =====
function getShortWeekday(date) {
  const full = Store.getWeekday(date);
  return '周' + full.slice(-1);
}

// ===== Calendar Rendering =====
function renderCalendar() {
  document.getElementById('monthTitleText').textContent = `${currentYear} · ${currentMonth}月`;

  const grid = document.getElementById('calendarGrid');
  grid.innerHTML = '';

  const firstDay = new Date(currentYear, currentMonth - 1, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
  const daysInPrevMonth = new Date(currentYear, currentMonth - 1, 0).getDate();

  const monthWeights = Store.getMonthWeights(currentYear, currentMonth);

  // Previous month days
  for (let i = firstDay - 1; i >= 0; i--) {
    const day = daysInPrevMonth - i;
    const cell = createDayCell(day, true);
    grid.appendChild(cell);
  }

  // Current month days
  for (let day = 1; day <= daysInMonth; day++) {
    const key = `${currentYear}-${currentMonth}-${day}`;
    const weightData = monthWeights[key];
    const cell = createDayCell(day, false, weightData ? weightData.value : null);
    grid.appendChild(cell);
  }

  // Next month days (fill remaining cells)
  const totalCells = firstDay + daysInMonth;
  const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for (let day = 1; day <= remaining; day++) {
    const cell = createDayCell(day, true);
    grid.appendChild(cell);
  }
}

function createDayCell(day, isOtherMonth, weight) {
  const cell = document.createElement('div');
  cell.className = 'day-cell';

  const dayOfWeek = new Date(currentYear, currentMonth - 1, day).getDay();
  const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
  const isToday = today.getFullYear() === currentYear &&
                  (today.getMonth() + 1) === currentMonth &&
                  day === today.getDate();
  const isSelected = day === selectedDate && !isOtherMonth;

  if (isOtherMonth) cell.classList.add('other-month');
  if (isWeekend && !isOtherMonth) cell.classList.add('weekend');
  if (isToday) cell.classList.add('today');
  if (isSelected) cell.classList.add('selected');
  if (weight !== null) cell.classList.add('has-weight');

  // Date number
  let html = `<div class="day-num">${day}</div>`;

  // Weight value + change indicator (only for current month days with weight)
  if (weight !== null && !isOtherMonth) {
    html += `<div class="day-weight">${weight.toFixed(1)}</div>`;

    const prevDay = day - 1;
    const prevKey = prevDay > 0
      ? `${currentYear}-${currentMonth}-${prevDay}`
      : `${currentYear}-${currentMonth - 1}-${new Date(currentYear, currentMonth - 1, 0).getDate()}`;
    const prevWeight = Store.getWeight(prevKey);

    if (prevWeight) {
      const diff = weight - prevWeight.value;
      if (diff > 0) {
        html += `<div class="day-change up">
          <svg viewBox="0 0 24 24"><path d="M7 14l5-5 5 5z"/></svg>${diff.toFixed(1)}
        </div>`;
      } else if (diff < 0) {
        html += `<div class="day-change down">
          <svg viewBox="0 0 24 24" style="transform:rotate(180deg)"><path d="M7 14l5-5 5 5z"/></svg>${Math.abs(diff).toFixed(1)}
        </div>`;
      } else {
        html += `<div class="day-change flat">— 0.0</div>`;
      }
    } else {
      html += `<div class="day-change flat">—</div>`;
    }
  }

  cell.innerHTML = html;

  cell.addEventListener('click', () => {
    if (isOtherMonth) return;
    selectedDate = day;
    const key = `${currentYear}-${currentMonth}-${day}`;
    const w = Store.getWeight(key);
    currentWeight = w ? w.value : 60.0;

    // 更新选中状态
    document.querySelectorAll('.day-cell.selected').forEach(c => c.classList.remove('selected'));
    cell.classList.add('selected');

    // 只更新底部卡片，不跳转
    updateBottomCard();
  });

  return cell;
}

// ===== Navigation =====
function prevMonth() {
  currentMonth--;
  if (currentMonth < 1) {
    currentMonth = 12;
    currentYear--;
  }
  selectedDate = Math.min(selectedDate, new Date(currentYear, currentMonth, 0).getDate());
  animateCalendar('slide-right');
  renderCalendar();
  updateBottomCard();
}

function nextMonth() {
  currentMonth++;
  if (currentMonth > 12) {
    currentMonth = 1;
    currentYear++;
  }
  selectedDate = Math.min(selectedDate, new Date(currentYear, currentMonth, 0).getDate());
  animateCalendar('slide-left');
  renderCalendar();
  updateBottomCard();
}

function animateCalendar(direction) {
  const grid = document.getElementById('calendarGrid');
  grid.classList.remove('slide-left', 'slide-right');
  void grid.offsetWidth; // trigger reflow
  grid.classList.add(direction);
}

function goToday() {
  const now = new Date();
  const newYear = now.getFullYear();
  const newMonth = now.getMonth() + 1;
  const newDate = now.getDate();
  if (newYear === currentYear && newMonth === currentMonth) {
    // 同月，只更新选中
    selectedDate = newDate;
    renderCalendar();
    updateBottomCard();
    return;
  }
  // 不同月，加动画
  const direction = newMonth > currentMonth || (newMonth === 1 && currentMonth === 12) ? 'slide-left' : 'slide-right';
  currentYear = newYear;
  currentMonth = newMonth;
  selectedDate = newDate;
  animateCalendar(direction);
  renderCalendar();
  updateBottomCard();
}

// ===== Swipe support =====
function initSwipe() {
  let startX = 0;
  let startY = 0;
  const grid = document.getElementById('calendarGrid');

  grid.addEventListener('touchstart', (e) => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });

  grid.addEventListener('touchend', (e) => {
    const endX = e.changedTouches[0].clientX;
    const endY = e.changedTouches[0].clientY;
    const diffX = endX - startX;
    const diffY = Math.abs(endY - startY);

    if (Math.abs(diffX) > 60 && diffY < 80) {
      if (diffX > 0) {
        prevMonth();
      } else {
        nextMonth();
      }
    }
  }, { passive: true });
}

// ===== Bottom Card =====
function updateBottomCard() {
  const key = `${currentYear}-${currentMonth}-${selectedDate}`;
  const weightData = Store.getWeight(key);
  const tasks = Store.getTasks(key);
  const card = document.getElementById('bottomCard');
  const contentEl = document.getElementById('cardContent');
  const emptyEl = document.getElementById('cardEmpty');
  const futureEl = document.getElementById('cardFuture');

  const selDate = new Date(currentYear, currentMonth - 1, selectedDate);
  const isTodayDate = Store.isToday(selDate);
  const isPastDate = Store.isPast(selDate);
  const isFutureDate = !isTodayDate && !isPastDate;

  const weekdayShort = getShortWeekday(selDate);

  // Reset card classes
  card.classList.remove('empty', 'future', 'disabled');

  // ---- Future date ----
  if (isFutureDate) {
    card.classList.add('future');
    contentEl.style.display = 'none';
    emptyEl.style.display = 'none';
    futureEl.style.display = 'block';
    document.getElementById('cardFutureDate').textContent =
      `${currentMonth}月${selectedDate}日 · ${weekdayShort}`;
    return;
  }

  futureEl.style.display = 'none';

  // ---- Today without record: empty state ----
  if (!weightData && isTodayDate) {
    card.classList.add('empty');
    contentEl.style.display = 'none';
    emptyEl.style.display = 'block';
    document.getElementById('emptyReminder').textContent = Messages.getWeightReminder();

    // Todo overview in empty state
    const doneCount = tasks.filter(t => t.completed).length;
    const totalCount = tasks.length;
    document.getElementById('emptyTodoDone').textContent = doneCount;
    document.getElementById('emptyTodoTotal').textContent = totalCount;
    return;
  }

  // ---- Normal state (has weight, or past date without weight) ----
  card.classList.remove('empty');
  contentEl.style.display = 'block';
  emptyEl.style.display = 'none';

  const cardWeightEl = document.querySelector('.card-weight');
  const changeEl = document.getElementById('cardChange');
  const msgEl = document.getElementById('cardMessage');

  // Date line with time
  const dateLine = `${currentMonth}月${selectedDate}日 · ${weekdayShort}`;
  if (weightData) {
    document.getElementById('cardDate').textContent = `${dateLine} · ${weightData.time} 记录`;
  } else {
    document.getElementById('cardDate').textContent = `${dateLine} · 未记录`;
  }

  // Weight value
  if (weightData) {
    cardWeightEl.innerHTML = `${weightData.value.toFixed(1)}<span class="unit">kg</span>`;
    currentWeight = weightData.value;

    // Change calculation
    const prev = Store.getPrevWeight(key);
    if (prev) {
      const diff = weightData.value - prev.value;
      const absDiff = Math.abs(diff).toFixed(1);

      if (diff > 0) {
        changeEl.className = 'card-change up';
        changeEl.innerHTML = `<svg viewBox="0 0 24 24"><path d="M7 14l5-5 5 5z"/></svg>${absDiff}`;
      } else if (diff < 0) {
        changeEl.className = 'card-change down';
        changeEl.innerHTML = `<svg viewBox="0 0 24 24" style="transform:rotate(180deg)"><path d="M7 14l5-5 5 5z"/></svg>${absDiff}`;
      } else {
        changeEl.className = 'card-change flat';
        changeEl.innerHTML = `— 0.0`;
      }
      msgEl.textContent = Messages.getWeightMessage(diff);
    } else {
      changeEl.className = 'card-change flat';
      changeEl.innerHTML = '· 新起点';
      msgEl.textContent = '第一天记录，从今天开始关注自己。';
    }
  } else {
    cardWeightEl.innerHTML = `--<span class="unit">kg</span>`;
    changeEl.className = 'card-change flat';
    changeEl.innerHTML = '';
    msgEl.textContent = '这一天没有记录体重，点击体重区域补录一个吧。';
  }

  // Todo overview
  const doneCount = tasks.filter(t => t.completed).length;
  const totalCount = tasks.length;
  document.getElementById('todoDone').textContent = doneCount;
  document.getElementById('todoTotal').textContent = totalCount;
}

function onBottomCardClick() {
  const key = `${currentYear}-${currentMonth}-${selectedDate}`;
  const weightData = Store.getWeight(key);
  const selDate = new Date(currentYear, currentMonth - 1, selectedDate);
  const isTodayDate = Store.isToday(selDate);
  const isPastDate = Store.isPast(selDate);
  const isFutureDate = !isTodayDate && !isPastDate;

  // Future date: not clickable
  if (isFutureDate) return;

  if (!weightData) {
    // 没有记录 → 打开录入弹窗
    openModal();
  } else {
    // 有记录 → 去日笺页
    saveState();
    location.href = `detail.html?date=${currentYear}-${currentMonth}-${selectedDate}&from=index`;
  }
}

function goToTodo() {
  saveState();
  location.href = `todo.html?date=${currentYear}-${currentMonth}-${selectedDate}&from=index`;
}

// ===== Weight Picker =====
function initWeightPicker() {
  const intPicker = document.getElementById('weightIntPicker');
  const decPicker = document.getElementById('weightDecPicker');

  // Integer column: 30 - 200
  intPicker.innerHTML = `<div style="height: ${12}px;"></div>`;
  for (let i = WEIGHT_MIN; i <= WEIGHT_MAX; i++) {
    const item = document.createElement('div');
    item.className = 'picker-item';
    item.dataset.value = i;
    item.textContent = i;
    item.addEventListener('click', () => scrollWeightIntTo(i));
    intPicker.appendChild(item);
  }
  intPicker.innerHTML += `<div style="height: ${12}px;"></div>`;

  // Decimal column: 0 - 9
  decPicker.innerHTML = `<div style="height: ${12}px;"></div>`;
  for (let i = 0; i <= 9; i++) {
    const item = document.createElement('div');
    item.className = 'picker-item';
    item.dataset.value = i;
    item.textContent = i;
    item.addEventListener('click', () => scrollWeightDecTo(i));
    decPicker.appendChild(item);
  }
  decPicker.innerHTML += `<div style="height: ${12}px;"></div>`;

  intPicker.addEventListener('scroll', () => updateWeightIntSelection());
  decPicker.addEventListener('scroll', () => updateWeightDecSelection());
}

function scrollWeightIntTo(val) {
  const col = document.getElementById('weightIntPicker');
  const index = val - WEIGHT_MIN;
  col.scrollTo({ top: index * PICKER_ITEM_H, behavior: 'smooth' });
}

function scrollWeightDecTo(val) {
  const col = document.getElementById('weightDecPicker');
  col.scrollTo({ top: val * PICKER_ITEM_H, behavior: 'smooth' });
}

function updateWeightIntSelection() {
  const col = document.getElementById('weightIntPicker');
  const scrollTop = col.scrollTop;
  const index = Math.round(scrollTop / PICKER_ITEM_H);
  const items = col.querySelectorAll('.picker-item');
  items.forEach((item, i) => item.classList.toggle('selected', i === index));
  weightInt = WEIGHT_MIN + index;
  currentWeight = weightInt + weightDec / 10;
}

function updateWeightDecSelection() {
  const col = document.getElementById('weightDecPicker');
  const scrollTop = col.scrollTop;
  const index = Math.round(scrollTop / PICKER_ITEM_H);
  const items = col.querySelectorAll('.picker-item');
  items.forEach((item, i) => item.classList.toggle('selected', i === index));
  weightDec = index;
  currentWeight = weightInt + weightDec / 10;
}

// ===== Time Picker =====
function initTimePicker() {
  const hourPicker = document.getElementById('hourPicker');
  const minutePicker = document.getElementById('minutePicker');

  // Hour column: 0 - 23
  hourPicker.innerHTML = `<div style="height: ${12}px;"></div>`;
  for (let i = 0; i <= 23; i++) {
    const item = document.createElement('div');
    item.className = 'picker-item';
    item.dataset.value = i;
    item.textContent = String(i).padStart(2, '0');
    item.addEventListener('click', () => scrollHourTo(i));
    hourPicker.appendChild(item);
  }
  hourPicker.innerHTML += `<div style="height: ${12}px;"></div>`;

  // Minute column: 0 - 59
  minutePicker.innerHTML = `<div style="height: ${12}px;"></div>`;
  for (let i = 0; i <= 59; i++) {
    const item = document.createElement('div');
    item.className = 'picker-item';
    item.dataset.value = i;
    item.textContent = String(i).padStart(2, '0');
    item.addEventListener('click', () => scrollMinuteTo(i));
    minutePicker.appendChild(item);
  }
  minutePicker.innerHTML += `<div style="height: ${12}px;"></div>`;

  hourPicker.addEventListener('scroll', () => updateHourSelection());
  minutePicker.addEventListener('scroll', () => updateMinuteSelection());
}

function scrollHourTo(val) {
  const col = document.getElementById('hourPicker');
  col.scrollTo({ top: val * PICKER_ITEM_H, behavior: 'smooth' });
}

function scrollMinuteTo(val) {
  const col = document.getElementById('minutePicker');
  col.scrollTo({ top: val * PICKER_ITEM_H, behavior: 'smooth' });
}

function updateHourSelection() {
  const col = document.getElementById('hourPicker');
  const scrollTop = col.scrollTop;
  const index = Math.round(scrollTop / PICKER_ITEM_H);
  const items = col.querySelectorAll('.picker-item');
  items.forEach((item, i) => item.classList.toggle('selected', i === index));
  pickerHour = index;
}

function updateMinuteSelection() {
  const col = document.getElementById('minutePicker');
  const scrollTop = col.scrollTop;
  const index = Math.round(scrollTop / PICKER_ITEM_H);
  const items = col.querySelectorAll('.picker-item');
  items.forEach((item, i) => item.classList.toggle('selected', i === index));
  pickerMinute = index;
}

// ===== Weight Modal =====
function openModal() {
  const selDate = new Date(currentYear, currentMonth - 1, selectedDate);
  const isTodayDate = Store.isToday(selDate);
  const weekdayShort = getShortWeekday(selDate);
  document.getElementById('modalDate').textContent =
    `${currentMonth}月${selectedDate}日 · ${weekdayShort}${isTodayDate ? ' · 今天' : ''}`;

  const key = `${currentYear}-${currentMonth}-${selectedDate}`;
  const w = Store.getWeight(key);

  // Set initial weight
  if (w) {
    currentWeight = w.value;
  } else {
    const prev = Store.getPrevWeight(key);
    if (prev) {
      currentWeight = prev.value;
    } else {
      currentWeight = 60.0;
    }
  }

  weightInt = Math.floor(currentWeight);
  weightDec = Math.round((currentWeight - weightInt) * 10);

  // Set initial time
  if (w && w.time) {
    const parts = w.time.split(':');
    pickerHour = parseInt(parts[0], 10);
    pickerMinute = parseInt(parts[1], 10);
  } else {
    const now = new Date();
    pickerHour = now.getHours();
    pickerMinute = now.getMinutes();
  }

  document.getElementById('weightModal').classList.add('active');

  // Scroll pickers to initial values (after modal is visible)
  setTimeout(() => {
    document.getElementById('weightIntPicker').scrollTop = (weightInt - WEIGHT_MIN) * PICKER_ITEM_H;
    document.getElementById('weightDecPicker').scrollTop = weightDec * PICKER_ITEM_H;
    document.getElementById('hourPicker').scrollTop = pickerHour * PICKER_ITEM_H;
    document.getElementById('minutePicker').scrollTop = pickerMinute * PICKER_ITEM_H;

    // Update selected states
    updateWeightIntSelection();
    updateWeightDecSelection();
    updateHourSelection();
    updateMinuteSelection();
  }, 50);
}

function closeModal() {
  document.getElementById('weightModal').classList.remove('active');
}

function adjustWeight(delta) {
  currentWeight = Math.max(WEIGHT_MIN, Math.min(WEIGHT_MAX, Math.round((currentWeight + delta) * 10) / 10));
  weightInt = Math.floor(currentWeight);
  weightDec = Math.round((currentWeight - weightInt) * 10);

  document.getElementById('weightIntPicker').scrollTo({
    top: (weightInt - WEIGHT_MIN) * PICKER_ITEM_H,
    behavior: 'smooth'
  });
  document.getElementById('weightDecPicker').scrollTo({
    top: weightDec * PICKER_ITEM_H,
    behavior: 'smooth'
  });
}

function saveWeight() {
  const key = `${currentYear}-${currentMonth}-${selectedDate}`;
  const time = `${String(pickerHour).padStart(2, '0')}:${String(pickerMinute).padStart(2, '0')}`;
  Store.setWeight(key, currentWeight, time);
  closeModal();
  renderCalendar();
  updateBottomCard();
  Store.toast('体重已记录 ✓');
}

// ===== Year-Month Picker =====
let pickerYear = currentYear;
let pickerMonth = currentMonth;

function initPicker() {
  const yearPicker = document.getElementById('yearPicker');
  const monthPicker = document.getElementById('monthPicker');

  // Generate years (2020-2035)
  yearPicker.innerHTML = '<div style="height: 12px;"></div>';
  for (let y = 2020; y <= 2035; y++) {
    const item = document.createElement('div');
    item.className = 'picker-item';
    item.dataset.value = y;
    item.textContent = y + ' 年';
    item.addEventListener('click', () => scrollToPicker('yearPicker', y - 2020));
    yearPicker.appendChild(item);
  }
  yearPicker.innerHTML += '<div style="height: 12px;"></div>';

  // Generate months
  monthPicker.innerHTML = '<div style="height: 12px;"></div>';
  for (let m = 1; m <= 12; m++) {
    const item = document.createElement('div');
    item.className = 'picker-item';
    item.dataset.value = m;
    item.textContent = m + ' 月';
    item.addEventListener('click', () => scrollToPicker('monthPicker', m - 1));
    monthPicker.appendChild(item);
  }
  monthPicker.innerHTML += '<div style="height: 12px;"></div>';

  yearPicker.addEventListener('scroll', () => updatePickerSelection('yearPicker', 'year'));
  monthPicker.addEventListener('scroll', () => updatePickerSelection('monthPicker', 'month'));
}

function scrollToPicker(colId, index) {
  const col = document.getElementById(colId);
  col.scrollTo({ top: index * PICKER_ITEM_H, behavior: 'smooth' });
}

function updatePickerSelection(colId, type) {
  const col = document.getElementById(colId);
  const scrollTop = col.scrollTop;
  const index = Math.round(scrollTop / PICKER_ITEM_H);
  const items = col.querySelectorAll('.picker-item');

  items.forEach((item, i) => {
    item.classList.toggle('selected', i === index);
  });

  if (type === 'year') {
    pickerYear = 2020 + index;
  } else {
    pickerMonth = index + 1;
  }
}

function openPicker() {
  pickerYear = currentYear;
  pickerMonth = currentMonth;
  document.getElementById('pickerModal').classList.add('active');

  setTimeout(() => {
    scrollToPicker('yearPicker', pickerYear - 2020);
    scrollToPicker('monthPicker', pickerMonth - 1);
  }, 50);
}

function closePicker() {
  document.getElementById('pickerModal').classList.remove('active');
}

function confirmPicker() {
  const direction = pickerMonth > currentMonth || (pickerMonth === 1 && currentMonth === 12) ? 'slide-left' : 'slide-right';
  currentYear = pickerYear;
  currentMonth = pickerMonth;
  selectedDate = Math.min(selectedDate, new Date(currentYear, currentMonth, 0).getDate());
  animateCalendar(direction);
  renderCalendar();
  updateBottomCard();
  closePicker();
}

// Click overlay to close modals
document.getElementById('weightModal').addEventListener('click', (e) => {
  if (e.target.id === 'weightModal') closeModal();
});
document.getElementById('pickerModal').addEventListener('click', (e) => {
  if (e.target.id === 'pickerModal') closePicker();
});

// bfcache 恢复时重新加载数据
window.addEventListener('pageshow', (e) => {
  if (e.persisted) {
    Store.reload();
    renderCalendar();
    updateBottomCard();
  }
});

// Keyboard support for weight input
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('weightModal').classList.contains('active')) return;
  if (e.key === 'ArrowUp' || e.key === 'ArrowRight') {
    adjustWeight(0.1);
  } else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') {
    adjustWeight(-0.1);
  } else if (e.key === 'Enter') {
    saveWeight();
  } else if (e.key === 'Escape') {
    closeModal();
  }
});

// Start
init();

// Hide native splash after page loads
window.addEventListener('load', function() {
  setTimeout(function() {
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SplashScreen) {
      window.Capacitor.Plugins.SplashScreen.hide();
    }
  }, 1000);
});

// Register Service Worker (PWA only, not in Capacitor APP)
if ('serviceWorker' in navigator && !(window.Capacitor && window.Capacitor.isNative)) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>

<script src="js/app-native.js"></script>
