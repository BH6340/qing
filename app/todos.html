<body data-page="todos">

<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="icon-btn" onclick="goBack()">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </div>
    <div class="title">
      <span>待办事项</span>
      <span class="sub">长期目标 · 不限日期</span>
    </div>
    <div class="icon-btn" style="visibility:hidden;">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </div>
  </div>

  <!-- Summary card -->
  <div class="summary-card">
    <div class="summary-top">
      <div class="summary-text">待办清单</div>
      <div class="summary-count"><strong id="pendingCount">0</strong> 项待完成</div>
    </div>
  </div>

  <!-- Quick add -->
  <div class="quick-add">
    <input type="text" id="todoInput" placeholder="添加待办事项..." maxlength="50">
    <div class="quick-add-btn" onclick="quickAdd()">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </div>
  </div>

  <!-- Pending todos -->
  <div class="task-section">
    <div class="task-section-title">
      待完成
      <span class="badge" id="pendingBadge">0</span>
    </div>
    <div class="todo-list" id="pendingList">
      <div class="empty-tasks">
        <div class="emoji">📋</div>
        还没有待办事项<br>添加一个长期目标吧
      </div>
    </div>
  </div>

  <!-- Completed todos -->
  <div class="task-section">
    <div class="task-section-title">
      已完成
      <span class="badge" id="doneBadge" style="background: var(--down-bg); color: var(--down);">0</span>
    </div>
    <div class="todo-list" id="doneList">
      <div class="empty-tasks" style="padding: 20px;">
        <div class="emoji" style="font-size:24px;">🌱</div>
        完成的待办会出现在这里
      </div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/messages.js"></script>
<script>
// ===== State =====
let pendingTodos = [];
let completedTodos = [];

// Touch drag state
let touchDrag = {
  active: false,
  longPressTimer: null,
  startX: 0,
  startY: 0,
  todoId: null,
  listType: null,
  ghost: null,
  overIndex: null
};

const LONG_PRESS_DELAY = 300;
const DRAG_THRESHOLD = 10;

// ===== Init =====
function init() {
  loadData();
  render();
}

// ===== Data =====
function loadData() {
  const todos = Store.getTodos();
  pendingTodos = todos.filter(t => !t.completed).sort((a, b) => a.order - b.order);
  completedTodos = todos.filter(t => t.completed).sort((a, b) => (b.completedAt || '').localeCompare(a.completedAt || ''));
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ===== Render =====
function render() {
  renderPending();
  renderDone();
  updateCounts();
}

function renderPending() {
  const list = document.getElementById('pendingList');
  document.getElementById('pendingBadge').textContent = pendingTodos.length;

  if (pendingTodos.length === 0) {
    list.innerHTML = `<div class="empty-tasks">
      <div class="emoji">📋</div>
      还没有待办事项<br>添加一个长期目标吧
    </div>`;
    return;
  }

  list.innerHTML = '';
  pendingTodos.forEach((todo, index) => {
    const item = document.createElement('div');
    item.className = 'todo-item';
    item.draggable = true;
    item.dataset.id = todo.id;
    item.dataset.index = index;

    item.innerHTML = `
      <div class="drag-handle">
        <span></span><span></span><span></span>
      </div>
      <div class="checkbox">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
      <div class="todo-text">${escapeHtml(todo.text)}</div>
      <div class="delete-btn">
        <svg viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </div>
    `;

    // Complete
    item.querySelector('.checkbox').addEventListener('click', () => completeTodo(todo.id));

    // Edit text
    item.querySelector('.todo-text').addEventListener('click', (e) => {
      e.stopPropagation();
      startEditTodo(item, todo, 'pending');
    });

    // Delete
    item.querySelector('.delete-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      deleteTodo(todo.id);
    });

    // Drag (HTML5 for desktop)
    item.addEventListener('dragstart', handleDragStart);
    item.addEventListener('dragover', handleDragOver);
    item.addEventListener('drop', handleDrop);
    item.addEventListener('dragend', handleDragEnd);

    // Touch drag on handle
    const handle = item.querySelector('.drag-handle');
    handle.addEventListener('touchstart', (e) => {
      e.preventDefault();
      startTouchDrag(e, todo.id, index, 'pending', item);
    }, { passive: false });

    list.appendChild(item);
  });
}

function renderDone() {
  const list = document.getElementById('doneList');
  document.getElementById('doneBadge').textContent = completedTodos.length;

  if (completedTodos.length === 0) {
    list.innerHTML = `<div class="empty-tasks" style="padding: 20px;">
      <div class="emoji" style="font-size:24px;">🌱</div>
      完成的待办会出现在这里
    </div>`;
    return;
  }

  list.innerHTML = '';
  completedTodos.forEach((todo) => {
    const item = document.createElement('div');
    item.className = 'todo-item completed';
    item.dataset.id = todo.id;

    item.innerHTML = `
      <div class="drag-handle" style="visibility:hidden;">
        <span></span><span></span><span></span>
      </div>
      <div class="checkbox">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
      </div>
      <div class="todo-text">${escapeHtml(todo.text)}</div>
      <div class="delete-btn">
        <svg viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </div>
    `;

    // Uncomplete
    item.querySelector('.checkbox').addEventListener('click', () => uncompleteTodo(todo.id));

    // Delete
    item.querySelector('.delete-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      deleteTodo(todo.id);
    });

    list.appendChild(item);
  });
}

function updateCounts() {
  document.getElementById('pendingCount').textContent = pendingTodos.length;
  document.getElementById('pendingBadge').textContent = pendingTodos.length;
  document.getElementById('doneBadge').textContent = completedTodos.length;
}

// ===== Actions =====
function quickAdd() {
  const input = document.getElementById('todoInput');
  const text = input.value.trim();
  if (!text) return;

  Store.addTodo(text);
  input.value = '';
  loadData();
  render();
  Store.toast('已添加');
}

function completeTodo(id) {
  Store.completeTodo(id);
  loadData();
  render();
  Store.toast(Messages.getTaskComplete());
}

function uncompleteTodo(id) {
  Store.uncompleteTodo(id);
  loadData();
  render();
}

function deleteTodo(id) {
  Store.deleteTodo(id);
  loadData();
  render();
  Store.toast('已删除');
}

// ===== Inline edit =====
function startEditTodo(itemEl, todo, listType) {
  const textEl = itemEl.querySelector('.todo-text');
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'todo-edit-input';
  input.value = todo.text;
  input.maxLength = 50;

  textEl.replaceWith(input);
  input.focus();
  input.select();

  function save() {
    const newText = input.value.trim();
    if (newText && newText !== todo.text) {
      Store.updateTodo(todo.id, { text: newText });
      loadData();
      render();
    } else {
      input.replaceWith(textEl);
    }
  }

  function cancel() {
    input.replaceWith(textEl);
  }

  input.addEventListener('blur', save);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      input.blur();
    } else if (e.key === 'Escape') {
      cancel();
    }
    e.stopPropagation();
  });
}

// ===== Drag & Drop (HTML5) =====
let dragSrcIndex = null;
let dragListType = null;

function handleDragStart(e) {
  dragSrcIndex = parseInt(e.currentTarget.dataset.index);
  dragListType = 'pending';
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function handleDragOver(e) {
  e.preventDefault();
  e.currentTarget.classList.add('drag-over');
}
function handleDrop(e) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const targetIndex = parseInt(e.currentTarget.dataset.index);
  if (dragSrcIndex === null || dragSrcIndex === targetIndex) return;

  Store.reorderTodos(dragSrcIndex, targetIndex);
  loadData();
  render();
}
function handleDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
  dragSrcIndex = null;
  dragListType = null;
}

// ===== Touch Drag =====
function startTouchDrag(e, todoId, index, listType, itemEl) {
  touchDrag.longPressTimer = setTimeout(() => {
    touchDrag.active = true;
    touchDrag.todoId = todoId;
    touchDrag.listType = listType;
    touchDrag.startX = e.touches[0].clientX;
    touchDrag.startY = e.touches[0].clientY;
    touchDrag.overIndex = index;

    // Create ghost
    const rect = itemEl.getBoundingClientRect();
    const ghost = itemEl.cloneNode(true);
    ghost.className = 'todo-item drag-ghost';
    ghost.style.width = rect.width + 'px';
    ghost.style.left = rect.left + 'px';
    ghost.style.top = rect.top + 'px';
    document.body.appendChild(ghost);
    touchDrag.ghost = ghost;

    itemEl.style.opacity = '0.3';
    if (navigator.vibrate) navigator.vibrate(50);
  }, LONG_PRESS_DELAY);
}

document.addEventListener('touchmove', (e) => {
  if (!touchDrag.active) {
    // Check if moved before long press fired -> cancel
    if (touchDrag.longPressTimer) {
      const dx = Math.abs(e.touches[0].clientX - touchDrag.startX);
      const dy = Math.abs(e.touches[0].clientY - touchDrag.startY);
      if (dx > DRAG_THRESHOLD || dy > DRAG_THRESHOLD) {
        clearTimeout(touchDrag.longPressTimer);
        touchDrag.longPressTimer = null;
      }
    }
    return;
  }
  e.preventDefault();

  const touch = e.touches[0];
  touchDrag.ghost.style.left = (touch.clientX - touchDrag.ghost.offsetWidth / 2) + 'px';
  touchDrag.ghost.style.top = (touch.clientY - touchDrag.ghost.offsetHeight / 2) + 'px';

  // Find over item
  const items = document.querySelectorAll('#pendingList .todo-item');
  let overIndex = null;
  items.forEach((item, i) => {
    const rect = item.getBoundingClientRect();
    if (touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
      overIndex = i;
    }
  });
  if (overIndex !== null && overIndex !== touchDrag.overIndex) {
    touchDrag.overIndex = overIndex;
  }
}, { passive: false });

document.addEventListener('touchend', (e) => {
  if (touchDrag.longPressTimer) {
    clearTimeout(touchDrag.longPressTimer);
    touchDrag.longPressTimer = null;
  }
  if (!touchDrag.active) return;

  const srcIndex = [...document.querySelectorAll('#pendingList .todo-item')]
    .findIndex(el => el.dataset.id === touchDrag.todoId);

  if (touchDrag.ghost) {
    touchDrag.ghost.remove();
    touchDrag.ghost = null;
  }
  document.querySelectorAll('#pendingList .todo-item').forEach(el => el.style.opacity = '');

  if (touchDrag.active && touchDrag.overIndex !== null && srcIndex !== touchDrag.overIndex) {
    Store.reorderTodos(srcIndex, touchDrag.overIndex);
    loadData();
    render();
  }

  touchDrag.active = false;
  touchDrag.todoId = null;
  touchDrag.overIndex = null;
});

// ===== Navigation =====
function goBack() {
  if (document.referrer) {
    history.back();
  } else {
    location.href = 'index.html';
  }
}

// ===== Start =====
init();
</script>
