</div>

<!-- Note editor modal -->
<div class="modal-overlay" id="noteModal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">日笺随笔</div>
    <div class="modal-subtitle">写下今天的所思所想</div>
    <div class="note-editor">
      <textarea id="noteTextarea" placeholder="今天发生了什么？有什么想说的..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeNoteModal()">取消</button>
      <button class="btn btn-primary" onclick="saveNote()">保存</button>
    </div>
  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/messages.js"></script>
<script>
// ===== State =====
let currentDate = '';
let currentWeight = 60.0;
let selectedMood = 'calm';
const moods = Store.getMoods();

// Weight picker state
let weightInt = 60;
let weightDec = 0;
const WEIGHT_MIN = 30;
const WEIGHT_MAX = 200;

// Time picker state
let pickerHour = 9;
let pickerMinute = 0;

// ===== Init =====
function init() {
  Store.load();
  updateStatusTime();
  setInterval(updateStatusTime, 30000);

  // 读取日期
  const dateParam = Store.getQueryParam('date');
  if (dateParam) {
    currentDate = dateParam;
  } else {
    currentDate = Store.dateKey(new Date());
  }

  const [y, m, d] = currentDate.split('-');
  const dateObj = new Date(y, m - 1, d);
  const weekday = Store.getWeekday(dateObj);

  document.getElementById('bigDay').innerHTML = `${parseInt(d)}<span class="sup">日</span>`;
  document.getElementById('monthYear').textContent = `${y} · ${m}月 · ${weekday}`;

  updateNavArrows();
  renderWeight();
  renderMood();
  renderTasks();
  renderNote();
  initWeightPicker();
  initTimePicker();
  initDatePicker();
}

function updateStatusTime() {
  const now = new Date();
  const h = now.getHours();
  const m = String(now.getMinutes()).padStart(2, '0');
  document.getElementById('statusTime').textContent = `${h}:${m}`;
}

function goToTodo() {
  location.href = `todo.html?date=${currentDate}&from=detail`;
}

// ===== Weight =====
function renderWeight() {
  const card = document.getElementById('weightCard');
  const weightData = Store.getWeight(currentDate);
  const prev = Store.getPrevWeight(currentDate);

  if (!weightData) {
    card.className = 'weight-card empty';
    card.innerHTML = `
      <div class="empty-text">
        今天还没记录体重<br>
        <strong>点击添加 →</strong>
      </div>
    `;
    return;
  }

  card.className = 'weight-card';
  currentWeight = weightData.value;

  let changeHtml = '';
  if (prev) {
    const diff = weightData.value - prev.value;
    const absDiff = Math.abs(diff).toFixed(1);

    if (diff > 0) {
      changeHtml = `
        <div class="weight-change up">
          <svg viewBox="0 0 24 24"><path d="M7 14l5-5 5 5z"/></svg>
          <span>${absDiff}</span>
        </div>`;
    } else if (diff < 0) {
      changeHtml = `
        <div class="weight-change down">
          <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
          <span>${absDiff}</span>
        </div>`;
    } else {
      changeHtml = `
        <div class="weight-change flat">
          — 持平
        </div>`;
    }
  }

  card.innerHTML = `
    <div class="weight-main">
      <div class="weight-value">${weightData.value.toFixed(1)}<span class="unit">kg</span></div>
      <div class="weight-time">⏰ ${weightData.time} 记录 · 点击修改</div>
    </div>
    ${changeHtml}
  `;
}

// ===== Weight Picker =====
function initWeightPicker() {
  const intPicker = document.getElementById('weightIntPicker');
  const decPicker = document.getElementById('weightDecPicker');

  intPicker.innerHTML = `<div style="height: 12px;"></div>`;
  for (let i = WEIGHT_MIN; i <= WEIGHT_MAX; i++) {
    const item = document.createElement('div');
    item.className = 'picker-item';
    item.dataset.value = i;
    item.textContent = i;
    item.addEventListener('click', () => scrollWeightIntTo(i));
    intPicker.appendChild(item);
  }
  intPicker.innerHTML += `<div style="height: 12px;"></div>`;

  decPicker.innerHTML = `<div style="height: 12px;"></div>`;
  for (let i = 0; i <= 9; i++) {
    const item = document.createElement('div');
    item.className = 'picker-item';
    item.dataset.value = i;
    item.textContent = i;
    item.addEventListener('click', () => scrollWeightDecTo(i));
    decPicker.appendChild(item);
  }
  decPicker.innerHTML += `<div style="height: 12px;"></div>`;

  intPicker.addEventListener('scroll', () => updateWeightIntSelection());
  decPicker.addEventListener('scroll', () => updateWeightDecSelection());
}

function scrollWeightIntTo(val) {
  document.getElementById('weightIntPicker').scrollTo({ top: (val - WEIGHT_MIN) * PICKER_ITEM_H, behavior: 'smooth' });
}

function scrollWeightDecTo(val) {
  document.getElementById('weightDecPicker').scrollTo({ top: val * PICKER_ITEM_H, behavior: 'smooth' });
}

function updateWeightIntSelection() {
  const col = document.getElementById('weightIntPicker');
  const index = Math.round(col.scrollTop / PICKER_ITEM_H);
  col.querySelectorAll('.picker-item').forEach((item, i) => item.classList.toggle('selected', i === index));
  weightInt = WEIGHT_MIN + index;
  currentWeight = weightInt + weightDec / 10;
}

function updateWeightDecSelection() {
  const col = document.getElementById('weightDecPicker');
  const index = Math.round(col.scrollTop / PICKER_ITEM_H);
  col.querySelectorAll('.picker-item').forEach((item, i) => item.classList.toggle('selected', i === index));
  weightDec = index;
  currentWeight = weightInt + weightDec / 10;
}

// ===== Time Picker =====
function initTimePicker() {
  const hourPicker = document.getElementById('hourPicker');
  const minutePicker = document.getElementById('minutePicker');

  hourPicker.innerHTML = `<div style="height: 12px;"></div>`;
  for (let i = 0; i <= 23; i++) {
    const item = document.createElement('div');
    item.className = 'picker-item';
    item.dataset.value = i;
    item.textContent = String(i).padStart(2, '0');
    item.addEventListener('click', () => scrollHourTo(i));
    hourPicker.appendChild(item);
  }
  hourPicker.innerHTML += `<div style="height: 12px;"></div>`;

  minutePicker.innerHTML = `<div style="height: 12px;"></div>`;
  for (let i = 0; i <= 59; i++) {
    const item = document.createElement('div');
    item.className = 'picker-item';
    item.dataset.value = i;
    item.textContent = String(i).padStart(2, '0');
    item.addEventListener('click', () => scrollMinuteTo(i));
    minutePicker.appendChild(item);
  }
  minutePicker.innerHTML += `<div style="height: 12px;"></div>`;

  hourPicker.addEventListener('scroll', () => updateHourSelection());
  minutePicker.addEventListener('scroll', () => updateMinuteSelection());
}

function scrollHourTo(val) {
  document.getElementById('hourPicker').scrollTo({ top: val * PICKER_ITEM_H, behavior: 'smooth' });
}

function scrollMinuteTo(val) {
  document.getElementById('minutePicker').scrollTo({ top: val * PICKER_ITEM_H, behavior: 'smooth' });
}

function updateHourSelection() {
  const col = document.getElementById('hourPicker');
  const index = Math.round(col.scrollTop / PICKER_ITEM_H);
  col.querySelectorAll('.picker-item').forEach((item, i) => item.classList.toggle('selected', i === index));
  pickerHour = index;
}

function updateMinuteSelection() {
  const col = document.getElementById('minutePicker');
  const index = Math.round(col.scrollTop / PICKER_ITEM_H);
  col.querySelectorAll('.picker-item').forEach((item, i) => item.classList.toggle('selected', i === index));
  pickerMinute = index;
}

function openWeightModal() {
  const [y, m, d] = currentDate.split('-');
  document.getElementById('weightModalDate').textContent = `${m}月${d}日`;

  const w = Store.getWeight(currentDate);
  if (w) {
    currentWeight = w.value;
  } else {
    const prev = Store.getPrevWeight(currentDate);
    currentWeight = prev ? prev.value : 60.0;
  }

  weightInt = Math.floor(currentWeight);
  weightDec = Math.round((currentWeight - weightInt) * 10);

  if (w && w.time) {
    const parts = w.time.split(':');
    pickerHour = parseInt(parts[0], 10);
    pickerMinute = parseInt(parts[1], 10);
  } else {
    const now = new Date();
    pickerHour = now.getHours();
    pickerMinute = now.getMinutes();
  }

  document.getElementById('weightModal').classList.add('active');

  setTimeout(() => {
    document.getElementById('weightIntPicker').scrollTop = (weightInt - WEIGHT_MIN) * PICKER_ITEM_H;
    document.getElementById('weightDecPicker').scrollTop = weightDec * PICKER_ITEM_H;
    document.getElementById('hourPicker').scrollTop = pickerHour * PICKER_ITEM_H;
    document.getElementById('minutePicker').scrollTop = pickerMinute * PICKER_ITEM_H;
    updateWeightIntSelection();
    updateWeightDecSelection();
    updateHourSelection();
    updateMinuteSelection();
  }, 50);
}

function closeWeightModal() {
  document.getElementById('weightModal').classList.remove('active');
}

function saveWeight() {
  const time = `${String(pickerHour).padStart(2, '0')}:${String(pickerMinute).padStart(2, '0')}`;
  Store.setWeight(currentDate, currentWeight, time);
  closeWeightModal();
  renderWeight();
  Store.toast('体重已保存 ✓');
}

// ===== Mood =====
function renderMood() {
  const card = document.getElementById('moodCard');
  const note = Store.getNote(currentDate);

  if (!note || !note.mood) {
    card.innerHTML = `
      <div class="mood-empty">
        还没记录今天的心情<br>
        <strong>点击设置 →</strong>
      </div>
    `;
    document.getElementById('moodMeta').textContent = '未设置';
    return;
  }

  selectedMood = note.mood;
  const mood = moods[note.mood] || moods.calm;

  card.innerHTML = `
    <div class="mood-display">
      <div class="mood-emoji">${mood.emoji}</div>
      <div class="mood-info">
        <div class="mood-name">${mood.name}</div>
        <div class="mood-desc">${mood.desc}</div>
      </div>
    </div>
  `;
  document.getElementById('moodMeta').textContent = mood.name;
}

function openMoodModal() {
  const grid = document.getElementById('moodGrid');
  grid.innerHTML = '';

  Object.entries(moods).forEach(([key, mood]) => {
    const opt = document.createElement('div');
    opt.className = 'mood-option' + (selectedMood === key ? ' selected' : '');
    opt.dataset.mood = key;
    opt.innerHTML = `
      <div class="emoji">${mood.emoji}</div>
      <div class="name">${mood.name}</div>
    `;
    opt.addEventListener('click', () => {
      selectedMood = key;
      document.querySelectorAll('.mood-option').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
    });
    grid.appendChild(opt);
  });

  document.getElementById('moodModal').classList.add('active');
}

function closeMoodModal() {
  document.getElementById('moodModal').classList.remove('active');
}

function saveMood() {
  const note = Store.getNote(currentDate) || {};
  note.mood = selectedMood;
  Store.setNote(currentDate, note);
  closeMoodModal();
  renderMood();
  renderNote(); // 可能创建了新 note
  Store.toast('心情已记录 ✓');
}

// ===== Tasks =====
function renderTasks() {
  const tasks = Store.getTasks(currentDate);
  const done = tasks.filter(t => t.completed);
  const pending = tasks.filter(t => !t.completed);
  const total = tasks.length;

  document.getElementById('statDone').textContent = done.length;
  document.getElementById('statPending').textContent = pending.length;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('tasksMeta').textContent = `${done.length} / ${total}`;

  const preview = document.getElementById('taskPreview');
  if (total === 0) {
    preview.innerHTML = `
      <div class="task-preview-item undone">
        <span class="dot"></span>
        <span class="text" style="color:var(--ink-mute);">还没有任务</span>
      </div>
    `;
    return;
  }

  // 先显示待完成的，再显示已完成的，最多6条
  const previewTasks = [...pending, ...done].slice(0, 6);
  preview.innerHTML = previewTasks.map(t => `
    <div class="task-preview-item ${t.completed ? 'done' : 'undone'}">
      <span class="dot"></span>
      <span class="text">${escapeHtml(t.text)}</span>
    </div>
  `).join('');
}

// ===== Note =====
function renderNote() {
  const card = document.getElementById('noteCard');
  const note = Store.getNote(currentDate);

  if (!note || !note.text || !note.text.trim()) {
    card.className = 'note-card empty-note';
    card.innerHTML = `
      <div class="empty-icon">✍️</div>
      <div class="empty-text">
        今天还没有写日笺<br>
        <strong>点击写几句 →</strong>
      </div>
    `;
    document.getElementById('noteMeta').textContent = '未写';
    return;
  }

  card.className = 'note-card';
  const text = note.text;
  const firstChar = text.charAt(0);
  const restText = text.slice(1);

  card.innerHTML = `
    <div class="note-text">
      <span class="first-char">${firstChar}</span>${restText.replace(/\n/g, '<br>')}
    </div>
    <div class="note-footer">
      <span class="note-time">📝 ${text.length} 字 · 写于 ${note.time || '--:--'}</span>
      <span class="note-edit">编辑</span>
    </div>
  `;
  document.getElementById('noteMeta').textContent = note.time || '已写';
}

function openNoteModal() {
  const note = Store.getNote(currentDate);
  document.getElementById('noteTextarea').value = note ? (note.text || '') : '';
  document.getElementById('noteModal').classList.add('active');
  // 聚焦
  setTimeout(() => document.getElementById('noteTextarea').focus(), 300);
}

function closeNoteModal() {
  document.getElementById('noteModal').classList.remove('active');
}

function saveNote() {
  const text = document.getElementById('noteTextarea').value.trim();
  if (!text) {
    // 如果空了，删除日笺
    const note = Store.getNote(currentDate);
    if (note) {
      Store.deleteNote(currentDate);
    }
    closeNoteModal();
    renderNote();
    return;
  }

  const note = Store.getNote(currentDate) || {};
  note.text = text;
  if (!note.mood) note.mood = 'calm';
  Store.setNote(currentDate, note);
  closeNoteModal();
  renderNote();
  renderMood();
  Store.toast('日笺已保存 ✓');
}

// ===== Date Picker =====
const PICKER_YEAR_MIN = 2020;
const PICKER_YEAR_MAX = 2035;
const PICKER_ITEM_H = 36; // compact picker item height
let pickerYear = 0;
let pickerMonth = 0;
let pickerDay = 0;

function initDatePicker() {
  const yearPicker = document.getElementById('yearPicker');
  const monthPicker = document.getElementById('monthPicker');
  const dayPicker = document.getElementById('dayPicker');

  // Year column
  yearPicker.innerHTML = `<div style="height: ${32}px;"></div>`;
  for (let y = PICKER_YEAR_MIN; y <= PICKER_YEAR_MAX; y++) {
    const item = document.createElement('div');
    item.className = 'picker-item';
    item.dataset.value = y;
    item.textContent = y;
    item.addEventListener('click', () => scrollPickerTo('yearPicker', y - PICKER_YEAR_MIN));
    yearPicker.appendChild(item);
  }
  yearPicker.innerHTML += `<div style="height: ${32}px;"></div>`;

  // Month column
  monthPicker.innerHTML = `<div style="height: ${32}px;"></div>`;
  for (let m = 1; m <= 12; m++) {
    const item = document.createElement('div');
    item.className = 'picker-item';
    item.dataset.value = m;
    item.textContent = m;
    item.addEventListener('click', () => scrollPickerTo('monthPicker', m - 1));
    monthPicker.appendChild(item);
  }
  monthPicker.innerHTML += `<div style="height: ${32}px;"></div>`;

  // Day column (will be regenerated when month/year changes)
  generateDayPicker();

  yearPicker.addEventListener('scroll', () => updatePicker('yearPicker', 'year'));
  monthPicker.addEventListener('scroll', () => {
    updatePicker('monthPicker', 'month');
    // 月份变化时可能需要调整日期
    adjustDayIfNeeded();
  });
  dayPicker.addEventListener('scroll', () => updatePicker('dayPicker', 'day'));
}

function generateDayPicker() {
  const dayPicker = document.getElementById('dayPicker');
  const daysInMonth = new Date(pickerYear, pickerMonth, 0).getDate();

  dayPicker.innerHTML = `<div style="height: ${32}px;"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const item = document.createElement('div');
    item.className = 'picker-item';
    item.dataset.value = d;
    item.textContent = d;
    item.addEventListener('click', () => scrollPickerTo('dayPicker', d - 1));
    dayPicker.appendChild(item);
  }
  dayPicker.innerHTML += `<div style="height: ${32}px;"></div>`;
}

function adjustDayIfNeeded() {
  const daysInMonth = new Date(pickerYear, pickerMonth, 0).getDate();
  if (pickerDay > daysInMonth) {
    pickerDay = daysInMonth;
    generateDayPicker();
    scrollPickerTo('dayPicker', pickerDay - 1);
  }
}

function scrollPickerTo(colId, index) {
  const col = document.getElementById(colId);
  col.scrollTo({ top: index * PICKER_ITEM_H, behavior: 'smooth' });
}

function updatePicker(colId, type) {
  const col = document.getElementById(colId);
  const scrollTop = col.scrollTop;
  const index = Math.round(scrollTop / PICKER_ITEM_H);
  const items = col.querySelectorAll('.picker-item');

  items.forEach((item, i) => {
    item.classList.toggle('selected', i === index);
  });

  if (type === 'year') {
    pickerYear = PICKER_YEAR_MIN + index;
  } else if (type === 'month') {
    pickerMonth = index + 1;
  } else if (type === 'day') {
    pickerDay = index + 1;
  }
}

function openDatePicker() {
  const [y, m, d] = currentDate.split('-').map(Number);
  pickerYear = y;
  pickerMonth = m;
  pickerDay = d;

  // 先生成日期列
  generateDayPicker();

  document.getElementById('datePickerModal').classList.add('active');

  setTimeout(() => {
    scrollPickerTo('yearPicker', pickerYear - PICKER_YEAR_MIN);
    scrollPickerTo('monthPicker', pickerMonth - 1);
    scrollPickerTo('dayPicker', pickerDay - 1);
  }, 50);
}

function closeDatePicker() {
  document.getElementById('datePickerModal').classList.remove('active');
}

function confirmDatePicker() {
  // 确保日期有效
  const daysInMonth = new Date(pickerYear, pickerMonth, 0).getDate();
  const finalDay = Math.min(pickerDay, daysInMonth);
  const targetDate = `${pickerYear}-${pickerMonth}-${finalDay}`;
  const targetDateObj = new Date(pickerYear, pickerMonth - 1, finalDay);
  // 检查是否是未来日期
  if (!Store.isPast(targetDateObj) && !Store.isToday(targetDateObj)) {
    Store.toast('这一天还没到呢，先看看过去的吧～');
    return;
  }
  closeDatePicker();
  location.href = `detail.html?date=${targetDate}`;
}

function prevDay() {
  const [y, m, d] = currentDate.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  date.setDate(date.getDate() - 1);
  const prev = Store.dateKey(date);
  location.href = `detail.html?date=${prev}`;
}

function nextDay() {
  const [y, m, d] = currentDate.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  date.setDate(date.getDate() + 1);
  // 检查是否是未来日期
  if (!Store.isPast(date) && !Store.isToday(date)) {
    Store.toast('已经是最新日期啦～');
    return;
  }
  const next = Store.dateKey(date);
  location.href = `detail.html?date=${next}`;
}

function updateNavArrows() {
  const [y, m, d] = currentDate.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  const nextDate = new Date(y, m - 1, d);
  nextDate.setDate(nextDate.getDate() + 1);
  const nextBtn = document.getElementById('nextDayBtn');
  // 如果下一天是未来（既不是过去也不是今天），禁用右箭头
  if (!Store.isPast(nextDate) && !Store.isToday(nextDate)) {
    nextBtn.classList.add('disabled');
  } else {
    nextBtn.classList.remove('disabled');
  }
}

// ===== Utils =====
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// Modal overlay clicks
document.getElementById('weightModal').addEventListener('click', (e) => {
  if (e.target.id === 'weightModal') closeWeightModal();
});
document.getElementById('moodModal').addEventListener('click', (e) => {
  if (e.target.id === 'moodModal') closeMoodModal();
});
document.getElementById('noteModal').addEventListener('click', (e) => {
  if (e.target.id === 'noteModal') closeNoteModal();
});
document.getElementById('datePickerModal').addEventListener('click', (e) => {
  if (e.target.id === 'datePickerModal') closeDatePicker();
});

// bfcache 恢复时重新加载数据
window.addEventListener('pageshow', (e) => {
  if (e.persisted) {
    Store.reload();
    renderWeight();
    renderMood();
    renderTasks();
    renderNote();
  }
});

// Start
init();
</script>

</body>
</html>
