<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dbb896"/>
      <stop offset="100%" style="stop-color:#a67850"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bg)"/>
  
  <!-- Chinese character "轻" stylized -->
  <text x="256" y="300" text-anchor="middle" font-family="Noto Serif SC, serif" font-size="220" font-weight="600" fill="white">轻</text>
  
  <!-- Small decorative line -->
  <line x1="180" y1="360" x2="332" y2="360" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
</svg>
